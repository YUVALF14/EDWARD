/* EDWARD — Chronicle atmosphere: offline, Safari-safe, reduced-motion aware. */
html,body{height:100%;height:100dvh;overscroll-behavior:none}
body{isolation:isolate;transition:background 1.3s ease}
body[data-mood="battle"]{background:radial-gradient(ellipse at 50% 8%,#574638 0%,#28251f 40%,#0e1211 95%)}
body[data-mood="north"]{background:radial-gradient(ellipse at 50% 12%,#324641 0%,#192b2b 48%,#0b1111 96%)}
body[data-mood="sea"]{background:radial-gradient(ellipse at 50% 8%,#2a4752 0%,#162831 53%,#0b1215 98%)}
body[data-mood="manor"]{background:radial-gradient(ellipse at 50% 7%,#4c4432 0%,#292a21 49%,#101411 96%)}
body[data-mood="succession"]{background:radial-gradient(ellipse at 50% 7%,#4b2c3d 0%,#281b29 52%,#0d1012 96%)}
body[data-mood="court"]{background:radial-gradient(ellipse at 50% 7%,#3e4033 0%,#22291f 52%,#0d1210 96%)}
#sceneArt{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.35;transition:opacity .9s}
#sceneArt svg{position:absolute;width:max(100%,520px);height:100%;left:50%;transform:translateX(-50%);filter:blur(.3px)}
#app{position:relative;z-index:1}
.card{background:linear-gradient(160deg,rgba(38,44,35,.95),rgba(26,32,27,.94) 50%,rgba(21,27,23,.97));border-color:#777961;box-shadow:0 24px 65px #000a,0 0 45px #0004 inset}
.card:after{content:'✣';position:absolute;right:24px;top:27%;font:115px Georgia,serif;color:#d1b985;opacity:.035;pointer-events:none}
.card .speaker,.card .quote,.card .context{position:relative;z-index:1}
.header{gap:5px}.header-actions{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.header-actions button{width:32px;height:32px;border:1px solid #6c715b;border-radius:50%;background:#1c231edc;color:#e3d1a0;font-size:16px;cursor:pointer;touch-action:manipulation;display:grid;place-items:center;padding:0}
.header-actions button[aria-pressed="true"]{background:#454333;border-color:#bba76d}
.header .topinfo{flex:1;font-size:10px}.header .logo{font-size:15px;white-space:nowrap}
.person-link{appearance:none;-webkit-appearance:none;border:0;background:none;color:inherit;font:inherit;line-height:inherit;text-decoration:underline;text-decoration-color:#c7ad6e90;text-underline-offset:4px;text-decoration-thickness:1px;padding:0;cursor:pointer;touch-action:manipulation;display:inline}
.person-link:focus-visible{outline:2px solid var(--gold);border-radius:2px}
.speaker .person-link{color:#f5efdc}.quote .person-link{color:#ead7a3}.context .person-link{color:#d9c79a}
.person-hint{font-size:9px;color:#b8a57a;margin-top:5px;letter-spacing:.045em}
.person-peek{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;padding:20px;background:#090c0aca;backdrop-filter:blur(6px)}
.person-peek.open{display:flex}
.person-panel{width:min(390px,100%);max-height:75dvh;overflow:auto;background:linear-gradient(145deg,#283026,#171d19);border:1px solid #b39a64;border-radius:19px;padding:23px;box-shadow:0 25px 80px #000c;user-select:text;-webkit-user-select:text}
.person-panel h2{font:normal 29px/1.1 Georgia,serif;margin:6px 0 7px}.person-panel p{font:15px/1.53 Georgia,serif;color:#e1dccd;margin:12px 0}.person-panel .muted{font:12px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#acb5a5}
.person-panel .peek-top{display:flex;justify-content:space-between;align-items:flex-start}.person-panel .peek-close{background:#2e352b;color:#f3e6c7;border:1px solid #7b755b;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}
.person-panel .person-bond{border-top:1px solid #59614f;padding:11px 0 0;font-size:12px;color:#c6c7b8;line-height:1.6}
.tap-actions{max-height:184px;padding-top:7px}
.tap-actions button{min-height:40px;font-size:12px}
.tap-actions button.delayed{grid-column:1/-1;min-height:35px;border:1px solid #a99868;background:#363528;color:#f5dfaa;animation:revealChoice .4s ease}
.tap-actions button.delayed[hidden]{display:none}
.tap-actions button.extra{min-height:30px}
@keyframes revealChoice{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.help{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intro .enter{cursor:pointer;touch-action:manipulation}
.intro .enter.secondary{margin-top:9px;padding:11px 17px;color:#d6d2c5;border-color:#5a6251;font-size:10px}
.intro .intro-tools{display:flex;gap:9px;margin-top:16px}
.intro .intro-tools button{border:1px solid #625f4b;background:#1b241eaa;color:#dccba1;padding:9px 13px;border-radius:9px;font-size:11px;cursor:pointer;touch-action:manipulation}
.intro{position:relative;z-index:2}.intro p{background:#111a1590;padding:8px 10px;border-radius:10px}
.save-row{border-top:1px solid #4b5445;padding:13px 0;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}
.save-row .save-title{font:16px Georgia,serif;color:#eee5d2}
.save-row .save-detail{font-size:11px;color:#b4b9a9;margin-top:5px}
.save-row .save-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.save-row button,.save-tools button,.save-tools label{background:#30392e;color:#eadbb7;border:1px solid #6e745d;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:11px;touch-action:manipulation}
.save-row button:disabled{opacity:.35;cursor:default}
.save-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.save-tools input{display:none}
.save-notice{font-size:12px;color:#c9bd9e;min-height:22px;margin-top:9px}
.atlas-wrap{position:relative;max-width:420px;margin:12px auto;border:1px solid #887954;border-radius:15px;overflow:hidden;background:linear-gradient(160deg,#283b40,#1a2b30);box-shadow:0 12px 40px #0006}
.atlas-wrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.atlas-wrap .atlas-sea{fill:#b9c6b9;font:italic 13px Georgia,serif;letter-spacing:.08em;opacity:.38}
.atlas-wrap .atlas-region{fill:#f2dfb2;font:small-caps 16px Georgia,serif;letter-spacing:.15em;opacity:.66}
.atlas-wrap .atlas-city{fill:#f8eac6;font:11px Georgia,serif;pointer-events:none;text-shadow:0 2px 4px #0b1815}
.atlas-wrap .atlas-spot{cursor:pointer;outline:none;touch-action:manipulation}
.atlas-wrap .atlas-spot circle{fill:#d8b66b;stroke:#152822;stroke-width:3;transition:r .15s}
.atlas-wrap .atlas-spot:focus circle,.atlas-wrap .atlas-spot.active circle{fill:#ffdfa2;stroke:#f8e4a0;stroke-width:2}
.atlas-wrap .atlas-spot circle.hit{fill:transparent;stroke:none}
.atlas-wrap .atlas-spot:focus-visible{outline:2px solid #d8b66b}
.atlas-detail{margin:0 13px 12px;padding:12px;border-top:1px solid #887954;min-height:80px;background:#0c1617a6;border-radius:8px;color:#e8dfc8}
.atlas-detail h3{font:20px Georgia,serif;margin:0 0 5px}.atlas-detail p{font:12px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;margin:0;color:#c7cbbd}
.atlas-caption{font-size:10px;color:#aeb7a9;line-height:1.45;margin:9px 0 16px}
@media(max-height:690px){.header-actions button{width:28px;height:28px;font-size:14px}.header .logo{font-size:14px}.tap-actions button{min-height:32px;font-size:11px}.tap-actions button.delayed{min-height:29px}.person-hint{display:none}}
@media(max-height:540px){.tap-actions{gap:4px;padding:4px}.tap-actions button{min-height:27px;padding:5px;font-size:10px}.tap-actions button.extra{min-height:23px}.tap-actions button.delayed{min-height:25px}.header-actions button{width:25px;height:25px}}
@media(prefers-reduced-motion:reduce){body,#sceneArt,.tap-actions button.delayed{transition:none!important;animation:none!important}}

/* Keep the opening and epilogue scrollable on short phones. */
.intro,.outro{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(max-height:690px){.intro .ornament{margin-bottom:12px}.intro .enter{margin-top:22px}.intro small{margin-top:11px}.outro{justify-content:flex-start}}
/* A casebook for the six causally linked chronicles. */
.story-case{border:1px solid #596554;border-radius:13px;margin:9px 0;background:#19221d;overflow:hidden}
.story-case summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px;cursor:pointer;list-style:none;touch-action:manipulation}
.story-case summary::-webkit-details-marker{display:none}
.story-case summary:after{content:'+';color:var(--gold);font-size:19px;order:3}
.story-case[open] summary:after{content:'−'}
.story-case-title{font:15px Georgia,serif;color:#eee0bf;letter-spacing:.02em}
.story-case-count{font-size:10px;line-height:1.3;color:#a5b0a0;text-align:right;margin-left:auto}
.story-case-body{border-top:1px solid #414e41;padding:10px 14px 16px}
.story-case-body p{font-size:13px;margin:8px 0 12px}
.story-beat{border-left:2px solid #857a5c;margin:13px 0;padding:3px 0 5px 11px;font:14px/1.45 Georgia,serif;color:#e3d8c4}
.story-beat small{display:block;margin-top:6px;color:#aeb6a8;font:11px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}

/* Less text by default; the full historical material is available on demand. */
.card.reading-focus .quote{font-size:clamp(22px,5.55vw,28px);line-height:1.36;max-height:48%;overflow-y:auto;letter-spacing:-.016em}
.card.reading-focus .rule{margin-top:clamp(15px,2.6vh,23px);margin-bottom:clamp(20px,4vh,32px)}
.card.reading-focus .context{max-height:25%;font-size:clamp(12px,3.1vw,14px);line-height:1.55;padding-top:13px;margin-top:auto}
.card.reading-focus .context b{margin-bottom:7px}
.card.reading-story .quote{max-height:49%;font-size:clamp(19px,4.9vw,24px)}
.card.reading-full .quote{max-height:46%}
.card.reading-full .context{max-height:27%}
.reading-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;min-height:29px;flex:0 0 auto;position:relative;z-index:4}
.reading-tools button{border:1px solid #837450;background:rgba(25,31,24,.88);color:#ead5a4;border-radius:999px;padding:7px 13px;font:11px/1.1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.03em;cursor:pointer;touch-action:manipulation}
.reading-tools button:focus-visible{outline:2px solid #e3ca8a;outline-offset:2px}
.reading-tools .reading-level-btn{font:10px/1.1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.11em;color:#cfc3a2;white-space:nowrap;border-color:#495340;background:rgba(22,29,23,.9);padding:7px 10px}
.header-actions .reading-toggle{font:600 12px Georgia,serif;letter-spacing:-.07em}
.header-actions .reading-toggle[aria-pressed="true"]{color:#f7e2a7;border-color:#d7b76d}
.reading-summary{border:1px solid #5d684f;background:linear-gradient(140deg,#263127,#1c251f);padding:14px 15px;border-radius:13px;margin-bottom:16px}
.reading-summary p{font:19px/1.38 Georgia,serif;margin:9px 0 10px;color:#f2e9d5}
.reading-stakes{font-size:13px;line-height:1.5;color:#d1c5ab}
.reading-detail{border:1px solid #485747;border-radius:12px;background:#18211b;margin:10px 0;overflow:hidden}
.reading-detail summary{list-style:none;cursor:pointer;padding:13px 13px;color:#edddbb;font:16px Georgia,serif;display:flex;flex-direction:column;gap:4px;position:relative;padding-right:35px;touch-action:manipulation}
.reading-detail summary::-webkit-details-marker{display:none}
.reading-detail summary:after{content:'+';position:absolute;right:13px;top:13px;font:20px -apple-system,BlinkMacSystemFont,sans-serif;color:#c9b17c}
.reading-detail[open] summary:after{content:'−'}
.reading-detail summary span{font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:#a7b3a1}
.reading-detail-body{padding:4px 13px 14px;border-top:1px solid #3d4c3f}
.reading-detail-body p{font:14px/1.6 Georgia,serif;color:#ded9cb}
.reading-detail-body .row{padding:9px 0}

 if(key==='heirs'){sb.regency=yes?'council':'household';sb.legitimacy=sbClamp(sb.legitimacy+(yes?1:0),-8,8);}

 sb.history.push({serial:ev.serial,year:sb.year,actor:ev.actor,template:'dossier:'+key,where:def.where,origin:'historical-dossier',side,arena,caseStage:stage,parent:stage==='echo'?key:null});sb.reactiveCount++;sb.yearTurn++;

/* EDWARD — INTERWOVEN CHRONICLES: 36 authored narrative beats in six causal arcs.
   Historic background is documented in the linked sources; ALL speeches, warrants,
   letters, negotiations and counterfactual incidents here are fictional reconstructions.
   Each scene has two independently authored versions, conditioned on previous choices.
   No scripted victory, betrayal, battle, or death is imposed on a counterfactual reign.
*/
const SE_STORIES={
 neville:{title:'THE KINGMAKER’S PRICE',start:1465,source:'https://www.royal.uk/edward-iv',anchor:'Warwick was an essential supporter of Edward IV, but their diplomatic and domestic interests diverged. Warwick changed sides in 1470 in recorded history. This simulation never forces that outcome.',lead:'warwick',beats:[
 {id:'counsel',year:1465,who:'Richard Neville, Earl of Warwick',role:'The king’s principal magnate · Westminster',where:'Westminster',tag:'THE PRICE OF COUNSEL',
  q:['Your Grace, my captains hold the northern roads in your name. Yet I cannot answer them when every petition must wait for a chamberlain’s whisper. Give me a clear commission, and I shall answer for my men.','Your Grace, the council has not forgotten Towton. If your servants now seek to govern without those who fought beside you, say so openly.'],
  ctx:'Warwick has military clients and authority in Calais. His request for a commission is also a request to distribute patronage.',
  l:'Issue a bounded northern commission.',r:'Keep appointments in the royal household.',
  le:{authority:1,people:{warwick:{trust:1,influence:1},montagu:{trust:1}},flags:{nevilleCommission:'bounded'},report:'Warwick accepts a commission whose terms are entered by the clerks.'},
  re:{authority:1,people:{warwick:{grievance:2,trust:-1},hastings:{influence:1}},flags:{nevilleCommission:'refused'},report:'Warwick returns to his household without a new warrant.'}},
 {id:'seal',year:1467,who:'George Neville',role:'Lord Chancellor · the Great Seal',where:'Westminster',tag:'THE SEAL AND THE ENVOY',
  q:['My brother believes that a French understanding will keep our enemies divided. Yet a Burgundian agent has been entertained in secret. Which undertaking am I to seal in the king’s name?','I have the Seal, Your Grace, but not your confidence. Warwick says your servants promise Burgundy what your envoys promise France. Shall I put my office behind either word?'],
  ctx:'The Chancellor is Warwick’s brother. A sealed letter binds the Crown more visibly than a private conversation.',
  l:'Record an open council policy.',r:'Reserve diplomacy to Edward’s own envoys.',
  le:{authority:1,credit:-1,people:{warwick:{trust:1},burgundy:{grievance:1}},flags:{foreignProcess:'council'},report:'The Chancellor records a public diplomatic instruction.'},
  re:{people:{warwick:{grievance:2},hastings:{trust:1},burgundy:{trust:1}},flags:{foreignProcess:'private'},reaction:{actor:'warwick',rival:'hastings',kind:'intelligence'},report:'George Neville requests a written explanation for the exclusion of Chancery.'}},
 {id:'clients',year:1468,who:'William Hastings',role:'Royal chamberlain · the outer court',where:'London',tag:'THE MEN IN TWO LIVERIES',
  q:['Warwick’s servants have brought a roll of names. They ask which of their men are to keep their fees after the new appointments. I can sign the warrants, but I cannot make both households satisfied.','Warwick’s men are already telling petitioners that your chamber is closed to them. One has offered me his service, and his former master calls it theft.'],
  ctx:'A household retainer may receive fees from more than one patron. The conflict is over access, not a formal declaration of rebellion.',
  l:'Publish the fee rolls and protect existing service.',r:'Allow Hastings to replace disputed officers.',
  le:{authority:1,credit:-1,people:{warwick:{trust:1},hastings:{trust:1}},flags:{clientSettlement:'published'},report:'A fee roll is displayed at Westminster; several names appear on both lists.'},
  re:{people:{warwick:{grievance:2},hastings:{influence:1,trust:1}},flags:{clientSettlement:'household'},report:'Hastings fills vacant places. Warwick’s clerks dispute which vacancies were real.'}},
 {id:'affinity',year:1469,who:'A sheriff of Warwickshire',role:'A sealed report from the shire',where:'Midlands',tag:'A RETINUE ASSEMBLES',
  q:['Two bands of men wear different badges and each says he rides under a royal licence. The market has closed early. I beg leave to summon both captains before a jury, not before one another.','The Neville servants have hired horses by the dozen. They call it an escort for the Earl; their neighbours call it a muster. The first blow may be struck before my next letter.'],
  ctx:'A local muster may be protection, intimidation, or rebellion. Edward has the sheriff’s account, not access to the private instructions.',
  l:'Demand sureties from both affinities.',r:'Allow the stronger household to restore order.',
  le:{authority:1,unrest:{Midlands:-2},people:{warwick:{grievance:1},hastings:{grievance:1}},flags:{affinityPeace:'sureties'},report:'The captains swear peace before the sheriff, though some men keep their badges.'},
  re:{authority:-1,unrest:{Midlands:2},people:{warwick:{influence:1,grievance:1}},flags:{affinityPeace:'delegated'},report:'The roads open, but the sheriff reports that one lord now commands both toll gates.'}},
 {id:'terms',year:1470,who:'Richard Neville, Earl of Warwick',role:'An audience sought through intermediaries',where:'Calais',tag:'TERMS OF ALLEGIANCE',
  q:['I have kept your ports, Your Grace. My men ask what place remains for them when new kindred sit beside your chair. Let us write our obligations before mistrust makes traitors of servants.','You may call my followers troublesome, but they are men who have been refused justice. I will not send them home upon a promise that can be forgotten at supper.'],
  ctx:'Warwick’s loyalty is a political choice, not an inevitable historical switch. His grievance is shaped by earlier appointments, the queen’s kin and foreign policy.',
  l:'Negotiate guarantees with named witnesses.',r:'Demand unconditional submission.',
  le:{authority:1,credit:-1,people:{warwick:{trust:2,grievance:-2},montagu:{trust:1}},flags:{nevilleTerms:'negotiated'},report:'Warwick sends a list of proposed sureties; not every captain agrees to sign.'},
  re:{authority:1,people:{warwick:{grievance:3,trust:-2},montagu:{grievance:1}},unrest:{North:1},flags:{nevilleTerms:'ultimatum'},reaction:{actor:'warwick',rival:'hastings',kind:'retinue'},report:'The Earl withdraws before the witnesses arrive. His servants say he has not renounced the king.'}},
 {id:'reckoning',year:1472,who:'A clerk of the royal Council',role:'An inquiry into service and pardons',where:'Westminster',tag:'THE COST OF RECONCILIATION',
  q:['The Earl’s captains have brought their oaths. They will surrender private warrants if the Crown will confirm their lands. Shall we make this peace part of the record?','Several Neville captains seek pardons, but no one agrees on the offences. To pardon without hearing them may purchase peace; to examine them may uncover a new quarrel.'],
  ctx:'The outcome depends on whether the Earl retained trust, how northern lands were settled, and whether rival households were heard.',
  l:'Confirm conditional pardons and land guarantees.',r:'Require separate hearings for every captain.',
  le:{authority:1,people:{warwick:{grievance:-2,trust:1},montagu:{trust:1}},flags:{nevilleSettlement:'pardon'},report:'Some Neville captains return their private commissions and receive royal letters.'},
  re:{authority:2,people:{warwick:{grievance:1},hastings:{trust:1}},flags:{nevilleSettlement:'inquest'},report:'The council opens individual inquiries. A few retainers depart before they can be called.'}}
 ]},
 woodville:{title:'THE QUEEN’S DOOR',start:1465,requires:s=>s.sandbox.marriage==='elizabeth',source:'https://www.royal.uk/edward-iv',anchor:'Edward IV married Elizabeth Woodville in 1464. Patronage for her kin contributed to political tension. The particular petitions and dialogues are fictional.',lead:'woodville',beats:[
 {id:'petition',year:1465,who:'Elizabeth Woodville',role:'Queen of England · the privy chamber',where:'Westminster',tag:'THE QUEEN’S PETITION',
  q:['My lord, Anthony served his family before he served mine. He asks for a place he can perform, not a title he can wear. Must my marriage make every honest petition suspect?','Your servants say a queen should ask nothing for her own blood. Yet when other lords advance their cousins it is called good government. Tell me which rule applies to us.'],
  ctx:'The queen’s family has pre-existing connections. Her marriage amplifies both their opportunities and resentment from other households.',
  l:'Grant Anthony a limited office with public terms.',r:'Refer every Woodville petition to Council.',
  le:{people:{woodville:{influence:1,trust:1},warwick:{grievance:1}},flags:{queenAccess:'direct'},report:'A Woodville commission is entered on the patent rolls.'},
  re:{authority:1,people:{woodville:{grievance:1},warwick:{trust:1}},flags:{queenAccess:'council'},report:'The Council receives the petition. The queen has not withdrawn it.'}},
 {id:'marriage',year:1466,who:'Anthony Woodville',role:'The queen’s brother · a marriage negotiation',where:'Westminster',tag:'A MARRIAGE WITH A PRICE',
  q:['A ward of good estate has been offered to our kin in marriage. I will not pretend the lands do not matter. But the child’s guardian has already taken a fee from another suitor.','The match could strengthen the queen’s house, Your Grace. Yet Warwick’s friends say the guardian once promised the ward elsewhere. They have produced no writing.'],
  ctx:'Marriage negotiations may redirect inherited property and create a rival claim. The Crown knows only the offers presented to it.',
  l:'Approve only after inspecting the wardship.',r:'Permit the private match without an inquiry.',
  le:{authority:1,people:{woodville:{trust:1},warwick:{trust:1}},flags:{woodvilleMatch:'audited'},report:'The wardship is referred to royal officers; both suitors must show their terms.'},
  re:{authority:-1,people:{woodville:{influence:1},warwick:{grievance:2}},flags:{woodvilleMatch:'private'},report:'A private marriage settlement is announced. Its land clauses are not lodged with the court.'}},
 {id:'chamber',year:1468,who:'William Hastings',role:'The king’s chamberlain · access to court',where:'London',tag:'WHO MAY SEE THE KING',
  q:['Petitioners wait in my chamber with letters bearing the queen’s name. I do not doubt her good will. I ask whether the king’s justice now begins at her door or at his seal.','A Woodville clerk has promised a hearing to a man I already refused. If his word is enough, my office is an ornament. If mine is enough, the queen will call it an insult.'],
  ctx:'Court access affects who can press claims and who bears the blame for rejected petitions.',
  l:'Establish one recorded petition register.',r:'Maintain separate channels for royal kin.',
  le:{authority:2,people:{hastings:{trust:1},woodville:{grievance:1}},flags:{petitionDoor:'register'},report:'The first shared petition register exposes two promises for the same office.'},
  re:{people:{woodville:{influence:1},hastings:{grievance:1}},flags:{petitionDoor:'separate'},report:'Two clerks give different dates for the same audience. Neither will withdraw his entry.'}},
 {id:'charter',year:1470,who:'A clerk of the Exchequer',role:'Royal grants and resumed revenues',where:'Westminster',tag:'THE PRICE OF A GRANT',
  q:['A grant to the queen’s kindred names rents already pledged to a northern captain. The same money cannot pay both. Which promise shall I put in the accounts?','The rents promised to the queen’s kin have not arrived. A Neville steward says they were pledged years ago. I have two warrants and one sheriff.'],
  ctx:'This is an imagined accounting dispute, not a claim that a particular historical charter existed. Earlier royal patronage determines who feels wronged.',
  l:'Protect the earlier claim until an audit.',r:'Pay the queen’s kin and offer compensation.',
  le:{credit:1,authority:1,people:{warwick:{trust:1},woodville:{grievance:2}},flags:{woodvilleRents:'audited'},report:'The Exchequer freezes a disputed rent pending a public account.'},
  re:{credit:-2,people:{woodville:{trust:1,influence:1},warwick:{grievance:2}},flags:{woodvilleRents:'preferred'},report:'The sheriff pays one warrant. The displaced creditor petitions for compensation.'}},
 {id:'wardship',year:1474,who:'Elizabeth Woodville',role:'The queen’s household · a minor heir',where:'Westminster',tag:'A CHILD AND AN INHERITANCE',
  q:['A young heir has been placed among my attendants. His mother asks that I keep him safe; his uncle asks for the rents. They are not the same request, and I will not pretend they are.','The child’s relatives have begun sending gifts to rival guardians. If the Crown does not name who may hold his person, they will decide it without us.'],
  ctx:'A wardship combines the care of a minor with temporary control of property. The child is not merely a prize in an adult dispute.',
  l:'Separate guardianship from estate revenues.',r:'Entrust both powers to the queen’s household.',
  le:{authority:1,people:{woodville:{trust:1},hastings:{trust:1}},flags:{queenWard:'separated'},report:'Guardianship and estate income are assigned to different officers.'},
  re:{authority:-1,people:{woodville:{influence:2},hastings:{grievance:1}},flags:{queenWard:'united'},report:'The queen’s household receives custody and rents; a distant kinsman files a protest.'}},
 {id:'reckoning',year:1478,who:'Anthony Woodville',role:'A petition from the queen’s kin',where:'Westminster',tag:'THE FAMILY ACCOUNT',
  q:['We have been favoured, yes. We have also been blamed for every office lost by another man. Let the clerks count our service beside our grants before they write our family into a charge.','Your Grace, I am told we must surrender places to prove we deserve the ones we keep. Name the offence, and I will answer it. Do not make kinship itself a crime.'],
  ctx:'The king must balance public trust, the queen’s household and established noble networks; there is no automatic historical verdict.',
  l:'Publish a review of all household grants.',r:'Protect the queen’s grants from further challenge.',
  le:{authority:2,people:{woodville:{trust:1,grievance:1},warwick:{trust:1}},flags:{queenSettlement:'review'},report:'A register of household grants is opened; it names favours from several competing affinities.'},
  re:{authority:-1,people:{woodville:{influence:1,trust:1},hastings:{grievance:1}},flags:{queenSettlement:'privilege'},report:'Royal protection quiets some petitions, but complaints continue in private.'}}
 ]},
 north:{title:'THE NORTHERN INHERITANCE',start:1465,source:'https://www.historyofwar.org/articles/battles_barnet.html',anchor:'The Nevilles and Percies contested power in the north. In recorded history Henry Percy regained the earldom of Northumberland in 1470 while John Neville received another title. The game allows different settlements.',lead:'montagu',beats:[
 {id:'title',year:1465,who:'John Neville, Lord Montagu',role:'Northern commander · York',where:'North',tag:'THE PRICE OF VICTORY',
  q:['My men kept the roads after Hexham. Now a Percy kinsman asks whether the old rents will be restored to his house. I can command the garrisons; I cannot make the tenants forget their former lord.','The Percies have sent agents to the market towns. They offer old protections and speak of hereditary right. If the king means to change the settlement, let him tell me before the garrisons hear it elsewhere.'],
  ctx:'Northern title, actual possession and local obedience are separate. The Percy–Neville rivalry did not begin with this letter.',
  l:'Commission an inquiry into old titles.',r:'Confirm Montagu’s present authority.',
  le:{authority:1,people:{montagu:{trust:1},percy:{trust:1}},flags:{northTitle:'inquest'},report:'An inquest is ordered. Percy claimants bring witnesses from several shires.'},
  re:{people:{montagu:{trust:1,influence:1},percy:{grievance:2}},flags:{northTitle:'neville'},report:'Montagu’s command is confirmed. Percy tenants continue to speak of the old title.'}},
 {id:'rents',year:1467,who:'A Percy household steward',role:'Rents and service · Northumberland',where:'North',tag:'WHO COLLECTS THE RENTS',
  q:['Your sheriff demands the rent in the king’s name. Montagu’s receiver demands it in his. Our old tenants say they have paid both before. Shall they sell their seed to pay twice?','The Neville receiver has seized our carts. He says he holds the lawful warrant. I ask only that the writ be read aloud where the tenants can hear it.'],
  ctx:'The king has competing accounts. The actual burden on tenants is visible, while the title behind the demand remains disputed.',
  l:'Suspend collection pending an audited account.',r:'Permit the current receiver to collect.',
  le:{credit:-1,authority:1,unrest:{North:-1},people:{percy:{trust:1},montagu:{grievance:1}},flags:{northRents:'suspended'},report:'A clerk posts the suspension at the market cross. Receivers protest the lost revenue.'},
  re:{credit:1,unrest:{North:1},people:{montagu:{trust:1},percy:{grievance:2}},flags:{northRents:'collected'},report:'The current receiver collects. Some tenants abandon their holdings until the dispute is heard.'}},
 {id:'earldom',year:1469,who:'Henry Percy',role:'Petitioner for northern inheritance',where:'York',tag:'THE OLD EARLDOM',
  q:['My father’s title has become a word men are forbidden to speak. I do not ask you to dishonour Lord Montagu. I ask whether the blood of my house may ever serve the Crown again.','The tenants will not be quiet because a Neville warrant calls me an intruder. I will serve you, Your Grace, if you will name what is to become of my inheritance.'],
  ctx:'The real 1470 Percy restoration is a historical pressure, not a mandatory script. Any settlement must address Montagu’s displaced interest.',
  l:'Restore Percy standing with compensation for Montagu.',r:'Keep the Neville title and offer Percy another office.',
  le:{authority:1,people:{percy:{trust:2,influence:1},montagu:{grievance:2,trust:-1}},flags:{northEarldom:'percy'},reaction:{actor:'montagu',rival:'percy',kind:'estate'},report:'Percy’s restoration is announced; Montagu’s stewards demand to see the compensation schedule.'},
  re:{people:{montagu:{trust:1,influence:1},percy:{grievance:2}},flags:{northEarldom:'neville'},report:'The Neville title stands. Percy accepts an office but his household disputes the conditions.'}},
 {id:'castle',year:1471,who:'The constable of a northern castle',role:'Garrison and oath · northern marches',where:'North',tag:'THE KEYS OF THE KEEP',
  q:['My soldiers swear to the king, but their wages come through a lord whose title is now questioned. If I surrender the keys to his rival, who will pay the men at the gate?','A new lord has sent his seal for the keys. The old captain says his oath remains good until he sees the king’s hand. I can hold the gate one week, perhaps two.'],
  ctx:'The castle is an illustrative northern stronghold, not a named documented siege. Garrisons have practical loyalties beyond the wording of a writ.',
  l:'Pay the garrison directly and take royal custody.',r:'Let the local lord retain the keys.',
  le:{credit:-2,authority:2,unrest:{North:-1},people:{montagu:{grievance:1},percy:{grievance:1}},flags:{northGarrison:'crown'},report:'The constable accepts royal wages. His former patron protests the cost of losing the keys.'},
  re:{credit:1,authority:-1,people:{montagu:{influence:1},percy:{grievance:1}},flags:{northGarrison:'lord'},report:'The keys remain in private custody; the constable asks who may command him in war.'}},
 {id:'oath',year:1474,who:'A northern justice of the peace',role:'A county hearing · Northumberland',where:'North',tag:'OATHS AFTER THE SETTLEMENT',
  q:['The same tenants have sworn obedience to two houses in ten years. They ask which oath a royal justice will enforce when the harvest is taken. I have brought their names, not their badges.','The old captains will attend your court if their rivals do. Each demands a guarantee that testimony will not be treated as confession. The villages need a peace they can recognize.'],
  ctx:'Earlier grants, a disputed earldom and garrison decisions determine whether royal peace is enforceable.',
  l:'Hold a public assize and record local obligations.',r:'Accept a private pact between the great houses.',
  le:{authority:2,credit:-1,unrest:{North:-2},people:{percy:{trust:1},montagu:{trust:1}},flags:{northOaths:'public'},report:'Tenants testify before royal justices; the strongest houses dislike the written limits.'},
  re:{authority:-1,unrest:{North:-1},people:{percy:{influence:1},montagu:{influence:1}},flags:{northOaths:'private'},report:'The households exchange private guarantees. Villagers are not shown their terms.'}},
 {id:'legacy',year:1478,who:'A messenger from York',role:'Northern county returns',where:'York',tag:'THE NORTH REMEMBERS',
  q:['Your justices have sent their final account. The roads are quieter, but men still ask which lord will speak for them when the next king is a child. Shall the Crown bind their service directly?','The great houses have made peace over the old rents. They now ask to appoint the very sheriffs who must judge future quarrels. Peace, they say, has earned them that right.'],
  ctx:'A settlement that ended one feud may create a new question about future royal authority and succession.',
  l:'Reserve the sheriff’s office to the Crown.',r:'Recognise the houses’ local nominations.',
  le:{authority:2,people:{montagu:{grievance:1},percy:{grievance:1}},flags:{northLegacy:'crown'},report:'Royal sheriffs take office. Some northern captains refuse to surrender their lists of tenants.'},
  re:{authority:-1,people:{montagu:{influence:1},percy:{influence:1}},flags:{northLegacy:'magnates'},report:'The great houses nominate local officers and promise to keep the roads open.'}}
 ]},
 caister:{title:'LETTERS FROM CAISTER',start:1467,source:'https://historicengland.org.uk/listing/the-list/list-entry/1287573',anchor:'Sir John Fastolf left Caister to John Paston. The Duke of Norfolk took the castle by force in 1469; the Pastons eventually regained it after Norfolk’s death in 1476. These royal interventions and speeches are imagined.',lead:'hastings',beats:[
 {id:'will',year:1467,who:'John Paston',role:'A disputed bequest · Norfolk',where:'Caister',tag:'THE WILL OF FASTOLF',
  q:['Sir John Fastolf left us his castle. My lord of Norfolk says other men sold him a better right. I have brought copies of the will; the originals are in danger whenever we send them upon the road.','The Duke’s men say possession proves title. If that is the law, why should a family keep its charters? I ask for a hearing before someone who does not wear Norfolk’s livery.'],
  ctx:'The will and its challengers are historical. Edward has the petitioner’s copy, not a judicial finding that settles every claim.',
  l:'Appoint independent examiners of the charters.',r:'Ask Norfolk to arbitrate the competing titles.',
  le:{authority:1,credit:-1,flags:{caisterTitle:'commission'},people:{hastings:{trust:1}},report:'Commissioners receive sealed copies of the Fastolf papers.'},
  re:{authority:-1,flags:{caisterTitle:'norfolk'},people:{hastings:{grievance:1}},report:'Norfolk’s steward offers a hearing on terms the Pastons say they cannot accept.'}},
 {id:'rents',year:1468,who:'Margaret Paston',role:'A letter concerning Caister rents',where:'Norfolk',tag:'THE RENTS OF A CASTLE',
  q:['The duke’s receiver has taken the rents before any judge has seen our title. My sons write brave words from London. Brave words do not feed the men who hold our gate.','I have counted the grain in the storehouse. It will not last if men take the rents and leave us the mouths. I ask not for favour, but for an order a sheriff will enforce.'],
  ctx:'Margaret Paston’s letters document the family’s struggle, but this particular address to Edward is fictional. The dispute now concerns food and possession.',
  l:'Protect the harvest pending judgment.',r:'Let the local receiver continue collecting.',
  le:{authority:1,credit:-1,flags:{caisterRents:'protected'},report:'A royal officer orders grain retained for the garrison; the receiver disputes his warrant.'},
  re:{credit:1,flags:{caisterRents:'taken'},people:{hastings:{grievance:1}},report:'The rents are collected. A letter from Caister warns of dwindling stores.'}},
 {id:'muster',year:1469,who:'A Norfolk sheriff',role:'The approaches to Caister',where:'Caister',tag:'THE MEN AT THE GATE',
  q:['The Duke of Norfolk has assembled men near Caister. He says they will merely enforce his title. The Pastons have barred the gate. Shall I ride between them with your banner?','There are armed men in the lanes, Your Grace. One side has the castle and the other the roads. Neither will be the first to dismiss its followers.'],
  ctx:'The historical siege took place in 1469. In this reign the outcome depends on earlier commissions, supplies and royal authority.',
  l:'Send the sheriff with a royal peace commission.',r:'Leave enforcement to the rival claimants.',
  le:{authority:1,credit:-1,unrest:{'East Anglia':-1},flags:{caisterPeace:'intervened'},report:'The sheriff rides to Caister with a sealed prohibition on armed entry.'},
  re:{authority:-1,unrest:{'East Anglia':2},flags:{caisterPeace:'abandoned'},report:'The duke’s men occupy the approaches; neither household accepts responsibility for the first shot.'}},
 {id:'gate',year:1470,who:'A messenger from Caister',role:'The disputed gatehouse · Norfolk',where:'Caister',tag:'THE GATEHOUSE LETTER',
  q:['The king’s commission has kept the gates shut to both claimants. Now the men ask who will pay for the watch. If you leave us without wages, the writ will become a scrap of parchment.','The outer gate has been forced, or so the messenger says; the castellan disputes his count of the men. A widow asks whether a royal writ can reach a besieged tower.'],
  ctx:'The exact state of Caister in this alternate timeline depends on Edward’s previous intervention. The messenger cannot verify every claim.',
  l:'Supply a paid royal garrison pending title judgment.',r:'Offer an immediate possession compromise.',
  le:{credit:-2,authority:2,unrest:{'East Anglia':-1},flags:{caisterGate:'royal'},report:'Royal wages reach the castle; the disputed title is not yet settled.'},
  re:{authority:-1,flags:{caisterGate:'compromise'},report:'The parties exchange proposed terms, but disagree over who may keep the keys.'}},
 {id:'widow',year:1473,who:'Margaret Paston',role:'A family letter · Norfolk',where:'Norfolk',tag:'A WIDOW’S REMEMBRANCE',
  q:['We have obeyed each hearing and paid for every journey to London. My sons are told that the king’s peace is worth waiting for. I ask how long a family must wait before a promise becomes a judgment.','The lawyers have made a trade of our title. One says the will is sound; another says the duke will never release possession. If you cannot settle it, tell us plainly what the law is worth.'],
  ctx:'Repeated legal expenses can ruin a gentry family even without open fighting. The case has accumulated costs and memories.',
  l:'Set a deadline for final judgment.',r:'Fund another private negotiation.',
  le:{authority:2,credit:-1,flags:{caisterDeadline:'public'},report:'A date for judgment is proclaimed. The duke’s representatives seek an adjournment.'},
  re:{credit:-1,flags:{caisterDeadline:'private'},report:'Intermediaries begin new talks; the Pastons warn that they cannot pay lawyers indefinitely.'}},
 {id:'patent',year:1476,who:'John Paston',role:'A petition after a change of lordship',where:'Caister',tag:'THE PATENT AND THE HEIR',
  q:['The Duke of Norfolk is dead, but our quarrel need not die with him. His heirs may inherit a claim they never examined. Shall the king settle possession now, while there is room for peace?','A new household speaks for the Norfolk inheritance. They say a king’s patent cannot erase the memory of their father’s right. We ask for title and a gate we may enter without an army.'],
  ctx:'Norfolk died in 1476 in recorded history; here the disputed rights and the settlement remain contingent. A patent may not end local resentment.',
  l:'Issue a recorded patent after a final inquest.',r:'Accept a settlement with shared rents.',
  le:{authority:2,flags:{caisterOutcome:'patent'},report:'A final royal patent is issued after the inquest; the losing party retains a right to petition.'},
  re:{authority:-1,credit:1,flags:{caisterOutcome:'shared'},report:'The claimants divide the rents and pledge not to use force, leaving title unresolved.'}}
 ]},
 diplomacy:{title:'THE TWO SHORES',start:1466,source:'https://www.royal.uk/edward-iv',anchor:'Edward IV’s diplomacy involved France, Burgundy and the Calais garrison. In recorded history he made a profitable agreement with Louis XI at Picquigny in 1475. No agreement is predetermined here.',lead:'burgundy',beats:[
 {id:'wool',year:1466,who:'A merchant of the Staple',role:'English wool trade · Calais',where:'Calais',tag:'THE MERCHANTS’ LEDGER',
  q:['Our wool crosses through Calais, but French agents offer easier passage if we will carry their letters. I sell cloth, not crowns. Shall I refuse a market because a lord distrusts its prince?','The Burgundian factor promises safe roads and asks for the king’s favour. The Frenchman promises lower duties. Neither promise is written in a language my clerk can enforce.'],
  ctx:'Calais was a key English commercial and military foothold. Merchants seek predictable duties, not necessarily their patrons’ foreign policy.',
  l:'Protect the existing Burgundian trading route.',r:'License exploratory French negotiations.',
  le:{credit:1,people:{burgundy:{trust:1},warwick:{grievance:1}},flags:{tradeRoute:'burgundy'},report:'Calais merchants renew their contracts; French intermediaries seek another channel.'},
  re:{credit:1,people:{warwick:{trust:1},burgundy:{grievance:1}},flags:{tradeRoute:'france'},report:'French merchants send draft terms; Burgundian factors ask if the king has changed policy.'}},
 {id:'embassy',year:1467,who:'Richard Neville, Earl of Warwick',role:'A returning diplomatic embassy',where:'Calais',tag:'THE EMBASSY RETURNS',
  q:['I was sent to hear France, not to be measured against a treaty made behind my back. Tell me what assurances I may carry before I face their king again.','The French council asks if my word is still the king’s. A Burgundian agent has been received by another door. An ambassador cannot serve two instructions at once.'],
  ctx:'The divergence between Warwick’s French diplomacy and Edward’s Burgundian interests is documented. The exact conversation is invented.',
  l:'Give Warwick a public, limited mandate.',r:'Use separate confidential envoys.',
  le:{authority:1,people:{warwick:{trust:1},burgundy:{grievance:1}},flags:{embassy:'public'},report:'A limited French mandate is sealed. Warwick complains about its narrow terms.'},
  re:{people:{warwick:{grievance:2},burgundy:{trust:1}},flags:{embassy:'private'},report:'Two envoys depart with different instructions. Neither sees the other’s letters.'}},
 {id:'letters',year:1469,who:'A clerk from the Calais council',role:'Foreign correspondence and secrecy',where:'Calais',tag:'LETTERS WITH TWO SEALS',
  q:['Two letters promise protection to merchants travelling the same road. One bears the Chancellor’s form; the other was carried without the Great Seal. Both are being shown as royal guarantees.','The Flemish factor asks which of your agents can pledge customs. He has heard that the Chancellor was denied the matter. If we contradict ourselves, the merchants will charge for the risk.'],
  ctx:'Conflicting instructions create financial and political costs even when neither foreign ruler intends immediate war.',
  l:'Reconcile the letters through Chancery.',r:'Keep the newer assurance and withdraw the old.',
  le:{authority:2,credit:-1,people:{warwick:{trust:1},burgundy:{trust:1}},flags:{foreignLetters:'reconciled'},report:'Chancery issues one schedule of customs obligations; both sides lose concessions.'},
  re:{authority:-1,credit:1,people:{warwick:{grievance:1},burgundy:{trust:1}},flags:{foreignLetters:'withdrawn'},report:'A private letter is recalled. Its bearer insists the king promised him protection.'}},
 {id:'captains',year:1472,who:'The captain of a Calais ship',role:'Channel passage and military stores',where:'Calais',tag:'THE PRICE OF A PASSAGE',
  q:['A convoy will sail under your colours. Burgundy offers an escort if we will carry soldiers. France offers safe passage if we carry no arms. The merchants ask for one answer before the tide turns.','Our stores have been counted twice, once for the garrison and once for an expedition that has not been ordered. Men will desert if they are promised pay from the same chest.'],
  ctx:'A naval escort is a logistical choice as much as a diplomatic declaration. Promises made to merchants and captains may conflict.',
  l:'Reserve ships and wages for defence of Calais.',r:'Prepare an expeditionary commitment.',
  le:{credit:1,authority:1,unrest:{Calais:-1},flags:{calaisPolicy:'defence'},report:'The garrison receives stores. Continental allies complain that England has not promised troops.'},
  re:{credit:-2,people:{burgundy:{trust:1}},flags:{calaisPolicy:'expedition'},report:'Ships are provisioned. The treasurer asks which customs revenue will cover the wages.'}},
 {id:'picquigny',year:1475,who:'An envoy of Louis XI',role:'French terms · near Picquigny',where:'France',tag:'THE OFFER OF PEACE',
  q:['My master offers payment, security for merchants, and an end to needless marching. He will not say that he fears you. He will say that he values a neighbour who knows the price of peace.','The Duke of Burgundy has promised more than his men have delivered, so my master believes. Will you stake the kingdom’s credit upon an ally’s arrival, or put a sum upon peace?'],
  ctx:'Edward historically negotiated the Treaty of Picquigny in 1475. This is an alternate negotiation; no payment arrives unless the player accepts enforceable terms.',
  l:'Negotiate peace with scheduled payments.',r:'Continue preparations for armed pressure.',
  le:{credit:3,authority:1,people:{burgundy:{grievance:2}},flags:{frenchSettlement:'payments'},report:'The French offer a schedule of payments; the first instalment is promised, not yet witnessed.'},
  re:{credit:-2,people:{burgundy:{trust:1}},unrest:{Calais:1},flags:{frenchSettlement:'campaign'},report:'The captains prepare to march. Merchants demand compensation for delayed convoys.'}},
 {id:'account',year:1477,who:'A royal treasurer',role:'Receipts from France and Calais',where:'Westminster',tag:'THE LEDGER AFTER PEACE',
  q:['The promised French receipts have improved our account, but the merchants ask whether the peace protects them as well as the king. I can pay a captain or forgive a duty, not both.','The campaign has consumed the credit pledged against the Staple. Our allies still speak of victory; our lenders speak of dates. Which obligation shall the Crown honour first?'],
  ctx:'The financial result is conditional on Edward’s earlier diplomacy, trade promises and military expenditure.',
  l:'Publish the accounts and pay verified obligations.',r:'Reserve funds for strategic patronage.',
  le:{credit:-1,authority:2,people:{london:{trust:1},burgundy:{grievance:1}},flags:{foreignAccount:'published'},report:'A public account is issued. Some creditors discover that their expected payment has been reduced.'},
  re:{credit:1,authority:-1,people:{london:{grievance:2},burgundy:{trust:1}},flags:{foreignAccount:'reserved'},report:'Royal officers retain a reserve for future service. The London lenders ask for a date.'}}
 ]},
 succession:{title:'THE BLOOD AND THE SEAL',start:1468,source:'https://www.cambridge.org/core/journals/historical-journal/article/abs/i-attainder-and-forfeiture-1453-to-15091/1EA8D0EFB954878797B941400045B969',anchor:'Clarence’s marriage and inheritance, the division of Neville estates, and Edward IV’s succession were major dynastic questions. Clarence was executed in 1478 in recorded history; the game does not force his fate.',lead:'woodville',beats:[

 {id:'marriage',year:1469,who:'George, Duke of Clarence',role:'A proposed Neville marriage settlement',where:'Westminster',tag:'A PRINCE’S MARRIAGE',
  q:['A Neville bride would bring lands and a great kinship. I will not ask you to love the match, only to judge whether my marriage may be treated as treason before it is made.','The Earl of Warwick offers his daughter in marriage. Your servants call the proposal a faction. If it is a danger, give me an honourable alternative.'],

 {id:'estates',year:1473,who:'A clerk of the royal Chancery',role:'Division of inherited lands',where:'Westminster',tag:'TWO BROTHERS, ONE INHERITANCE',
  q:['Clarence and Gloucester claim portions of the same inheritance. One presents a royal grant; the other produces a later promise. If I seal both, the sheriff will be ordered to dispossess himself.','Clarence asks for the lands you promised in place of the Neville marriage. Gloucester’s servants say the same estate was assigned to him already. Which instrument may the judges read?'],
  ctx:'The division of the Warwick and Neville inheritances between Clarence and Gloucester was historically contentious. Specific documents here are imagined.',
  l:'Require a judicial partition with written boundaries.',r:'Settle the estates through royal discretion.',
  le:{authority:2,credit:-1,people:{warwick:{grievance:1}},flags:{clarenceLands:'partition'},report:'Surveyors begin marking a division. Both princely households dispute the value of the parcels.'},
  re:{authority:-1,people:{woodville:{grievance:1}},flags:{clarenceLands:'favour'},report:'A royal grant settles possession for now; a rival household preserves its earlier claim.'}},
 {id:'charges',year:1477,who:'William Hastings',role:'A report on the king’s brother',where:'Westminster',tag:'THE ACCUSATION',
  q:['Men say Clarence has received oaths from servants who should answer to you. I have no sworn witness, only two letters with the same story. Shall I question their authors before the rumour becomes a charge?','A servant of Clarence has been arrested, and now the whole court speaks of treason. The testimony may be true or purchased. I ask leave to examine the seal before we accuse the prince.'],
  ctx:'Charges against Clarence became a grave political crisis in recorded history. In this timeline an allegation is not automatically proof.',
  l:'Order an independent inquiry with witnesses.',r:'Demand Clarence’s immediate submission.',
  le:{authority:2,credit:-1,flags:{clarenceCharge:'inquiry'},report:'Witnesses are summoned; the inquiry records contradictions in the first accounts.'},
  re:{authority:1,unrest:{Court:2},flags:{clarenceCharge:'summons'},report:'Clarence is summoned to answer. His retainers ask for assurances of safe conduct.'}},
 {id:'heir',year:1480,who:'A tutor of the royal household',role:'The prince’s education and protection',where:'Westminster',tag:'THE HEIR’S HOUSEHOLD',
  q:['The young prince must learn to govern men who now compete to guard his door. His mother asks for familiar attendants; the Council asks for officers owing service to the Crown. Whose names shall I enter?','A guardian may love the child and still seek the seal. Two houses have sent lists of attendants, each calling the other dangerous. I need an order that will survive a king’s absence.'],
  ctx:'If no heir is secure in this timeline, the same question concerns the succession settlement rather than a guaranteed historical prince.',
  l:'Divide education, custody and estate revenues.',r:'Concentrate guardianship in one trusted household.',
  le:{authority:2,people:{woodville:{grievance:1},hastings:{trust:1}},flags:{heirHousehold:'separated'},report:'Separate officers are appointed for the heir’s education, custody and revenues.'},
  re:{authority:-1,people:{woodville:{influence:1},hastings:{grievance:1}},flags:{heirHousehold:'united'},report:'One household receives the guardianship. Other counsellors ask who may remove its officers.'}},
 {id:'guardians',year:1482,who:'A clerk of the Council',role:'A sealed succession instrument',where:'Westminster',tag:'THE KING AFTER THE KING',
  q:['Your Grace, a regency can be named on parchment, but it will be made in corridors and at gates. If your heir is young, whose men will hold the Tower and whose officers the treasury?','The prince’s guardians have accepted their titles. They have not agreed which of them may summon soldiers or open the treasury. A succession instrument must answer those questions now.'],
  ctx:'The 1483 crisis is not scripted. The distribution of force, guardianship, revenues and trust shapes the later epilogue.',

  re:{authority:-2,people:{woodville:{influence:2},hastings:{grievance:1}},flags:{successionInstrument:'household'},report:'One household receives broad guardianship; rival officers quietly retain copies of older warrants.'}}
 ]}
};

/* EDWARD — INTERWOVEN CHRONICLES, an experimental rule-based narrative scheduler.
   The six arcs contain 36 distinct authored beats and conditional text variants.
   They compete for court time, cross-affect actors, and remember royal decisions.
   This is NOT an LLM or a documentary reconstruction of particular speeches.
*/
const SE_SUPPRESS_DOSSIERS=new Set(['queen','seal','caister','france','clarence','heirs']);
const _seNdCanStart=ndCanStart;
ndCanStart=function(s,key){return !SE_SUPPRESS_DOSSIERS.has(key)&&_seNdCanStart(s,key);};
function seInit(s){const sb=s.sandbox;if(sb.story){sb.story.crossovers||={};sb.story.crossJournal||=[];return sb.story;}
 // Migration from an older Living Chronicle save: do not replay 1465 events in 1478.
 const arcs={};for(const [id,def] of Object.entries(SE_STORIES)){
  const stage=sb.year>1465?Math.max(0,def.beats.findIndex(b=>b.year>=sb.year)):0;
  const migrated=sb.year>1465&&def.beats.every(b=>b.year<sb.year);
  arcs[id]={stage:migrated?def.beats.length:stage,dueYear:migrated?9999:Math.max(def.start,def.beats[stage].year),inFlight:false,lastChoice:null,lastYear:null,lastOutcome:null,heard:0};
 }
 sb.story={schema:1,arcs,crossovers:{},crossJournal:[],flags:{},journal:[],scheduledByYear:{},offscreen:[],causalLinks:[],property:{caister:{title:'disputed',possession:'paston',rents:'contested'},north:{title:'disputed',garrison:'local'}},storyChoices:0,deferrals:0};
 return sb.story;
}
function seVariant(s,id,beat,arc){const sb=s.sandbox,flags=seInit(s).flags;
 if(id==='neville'&&beat.id==='terms')return sb.actors.warwick.grievance>=4||flags.queenAccess==='direct'||flags.embassy==='private'?1:0;
 if(id==='neville'&&beat.id==='affinity')return sb.actors.warwick.grievance>=3?1:0;
 if(id==='diplomacy'&&beat.id==='embassy')return flags.foreignProcess==='private'||flags.tradeRoute==='burgundy'?1:0;
 if(id==='woodville'&&beat.id==='chamber')return flags.nevilleCommission==='refused'?1:0;
 if(id==='north'&&beat.id==='earldom')return flags.nevilleCommission==='refused'||sb.actors.percy.grievance>=3?1:0;
 if(id==='succession'&&beat.id==='charges')return flags.clarenceMarriage==='neville'||sb.actors.warwick.grievance>=4?1:0;
 if(id==='caister'&&beat.id==='gate')return flags.caisterPeace==='intervened'?0:1;
 if(id==='diplomacy'&&beat.id==='account')return flags.frenchSettlement==='payments'?0:1;
 return arc.lastChoice==='right'?1:0;
}
function seWhy(s,id,beat,arc){const st=seInit(s),sb=s.sandbox,parts=[];
 if(arc.lastOutcome)parts.push('Earlier royal order: '+arc.lastOutcome);
 const f=st.flags;
 if(id==='neville'&&f.queenAccess==='direct')parts.push('The queen’s kin have received direct royal patronage.');
 if(id==='neville'&&f.embassy==='private')parts.push('Warwick’s embassy was bypassed by confidential envoys.');
 if(id==='woodville'&&f.nevilleTerms==='ultimatum')parts.push('Warwick’s unresolved grievance makes the queen’s position more dangerous.');
 if(id==='north'&&f.nevilleTerms==='ultimatum')parts.push('The Neville settlement is politically unstable.');
 if(id==='caister'&&st.property.caister.possession==='norfolk')parts.push('A reported seizure has changed who physically holds the castle; the title remains contested.');
 if(id==='diplomacy'&&f.foreignProcess==='private')parts.push('Earlier royal instructions were sent without the Chancellor’s open endorsement.');
 if(id==='succession'&&f.queenWard==='united')parts.push('The queen’s household already holds concentrated guardianship in another dispute.');
 return parts.join(' ');
}
function seEffectiveBeat(s,id,beat){

  return {...beat,who:'A Calais merchant envoy',role:'Channel customs and safe passage',where:'Calais',tag:'A TRUCE WITHOUT AN ARMY',alternative:'commercial',
   q:['No English army has crossed to France. The merchants nevertheless have two proposals: French safe-conduct for wool ships, or separate licences with Burgundy. Neither offers a royal pension. Which will you sign?',
      'The French offer lower tolls, not tribute. Burgundy asks that its old route remain protected. The Staple wants a written guarantee it can enforce.'],
   ctx:'In recorded history Picquigny followed Edward’s 1475 invasion. In this alternate reign no expedition was ordered, so the Crown may negotiate commerce, but cannot collect a campaign settlement it never won.',
   l:'Sign a witnessed commercial truce.',r:'Keep separate French and Burgundian licences.',
   le:{credit:1,authority:1,people:{burgundy:{grievance:1},london:{trust:1}},flags:{frenchSettlement:'trade-truce'},report:'Calais merchants receive written safe-conduct terms; no French pension is promised.'},
   re:{credit:0,authority:-1,people:{burgundy:{trust:1},london:{grievance:1}},flags:{frenchSettlement:'divided-trade'},report:'Separate licences continue. Merchants price in the uncertainty of two customs regimes.'}};
 }
 // Clarence was executed in 1478 in recorded history; a loyal brother
 // in an alternate reign must not be accused of treason on a fixed date.
 if(id==='succession'&&beat.id==='charges'&&f.clarenceMarriage!=='neville'&&sb.actors.warwick.grievance<3&&f.clarencePlace==='recorded'){
  return {...beat,who:'William Hastings',role:'A household account concerning Clarence',tag:'A BROTHER’S ACCOUNTS',alternative:'loyal-clarence',
   q:['The Duke of Clarence has kept the terms of his recorded allowance. His officers now ask whether the Crown will honour an older promise of rents. I have the accounts, not an accusation. Shall the Exchequer hear them?',
      'Your brother’s servants bring receipts for service. There is no sworn charge against him, but his household wants written security for next year. How much independence will you allow?'],
   ctx:'Clarence’s execution in 1478 was not inevitable. This alternative dispute concerns recorded royal obligations because the earlier marriage and patronage choices did not create a treason crisis.',
   l:'Audit the allowance and publish the finding.',r:'Renew his allowance with strict conditions.',
   le:{authority:1,credit:-1,people:{warwick:{trust:1}},flags:{clarenceCharge:'audit'},report:'The Exchequer enters Clarence’s claims and orders the receipts compared.'},
   re:{authority:1,people:{warwick:{grievance:1}},flags:{clarenceCharge:'conditional'},report:'Clarence accepts a limited renewal but his household asks for longer security.'}};
 }
 return beat;
}
function seSkipQuietBeats(s){const sb=s.sandbox,st=seInit(s),f=st.flags;
 st.quietClosures||=[];
 for(const [id,arc] of Object.entries(st.arcs)){
  if(arc.inFlight)continue;
  const def=SE_STORIES[id];let skipped=0;

function frame(body,top){return `<div class="header"><div class="logo">EDWARD <em>IV</em></div><div class="topinfo">${E(top||CHAPTERS[world.chapterIndex]?.date||(world.sandbox?String(world.sandbox.year):'1461–1483'))}<br>${E(CHAPTERS[world.chapterIndex]?.name||(world.sandbox?'The living reign':'A reign in the making'))}</div><button class="history-icon" id="historyIcon" aria-label="Historical record">◌</button></div>${body}<div class="nav"><button data-view="realm">Realm</button><button data-view="people">People</button><button data-view="council">Council</button><button data-view="chronicle">Chronicle</button><button data-view="cases">Cases</button></div>`;}
function renderCard(){if(!current)return ending();cancelAnimationFrame(lockRAF);locked=true;lockStart=performance.now();closing=false;
 const n=current;const detail=arena?n[arena]:null;const who=detail?detail.who:n.who;const role=detail?detail.role:n.role;const quote=detail?detail.quote:fmt(n.quote,world);const context=detail?'You have changed who hears this matter. A decision is still required.':fmt(n.context,world);
 const hasUp=!arena&&!!n.up,hasDown=!arena&&!!n.down;const latest=world.reports.slice(-1)[0];
 const body=`<div class="deck"><div class="shadow-card"></div><article class="card" id="card" aria-label="Drag left or right to decide"><div class="card-top"><span>${E(n.where)} · ${E(n.when)}</span><span>${String(world.turn+1).padStart(2,'0')} · ${E(n.tag||'THE CROWN')}</span></div>${arena?`<div class="arena-badge">${arena==='up'?'THE INSTITUTIONAL ARENA':'THE PRIVATE ARENA'} · ${E(detail.title)}</div>`:`<div class="kicker">${E(n.storyInfo?'AN UNFOLDING CHRONICLE · PART '+n.storyInfo.step+'/'+n.storyInfo.total:n.caseInfo?'A HISTORICAL DOSSIER':CHAPTERS[world.chapterIndex]?.name||'THE LIVING REIGN')}</div>`}<div class="speaker">${E(who)}</div><div class="role">${E(role)}</div><div class="rule"></div><blockquote class="quote">“${E(quote)}”</blockquote><div class="context"><b>What Edward knows</b>${E(context)}${latest&&world.turn-latest.turn<=2?`<div class="quiet-report">LATEST REPORT · ${E(latest.from)}: ${E(latest.text)}</div>`:''}</div><div class="choice-chip left" id="chipLeft"></div><div class="choice-chip right" id="chipRight"></div>${hasUp?'<div class="choice-chip up" id="chipUp"></div>':''}${hasDown?'<div class="choice-chip down" id="chipDown"></div>':''}</article></div><div class="locktrack"><i id="lockfill"></i></div><div class="help" id="help">READ THE CARD · THE DECISION WILL RELEASE</div>`;
 app.innerHTML=frame(body);document.getElementById('chipLeft').textContent=(detail||n).left.label;document.getElementById('chipRight').textContent=(detail||n).right.label;
 if(hasUp)document.getElementById('chipUp').textContent='↑ '+n.up.title;if(hasDown)document.getElementById('chipDown').textContent='↓ '+n.down.title;
 bindNav();document.getElementById('historyIcon').onclick=showHistory;bindDrag(document.getElementById('card'),hasUp,hasDown);tickLock(hasUp,hasDown);
}
function tickLock(hasUp,hasDown){const fill=document.getElementById('lockfill'),hint=document.getElementById('help');function update(now){const p=LOCK_MS===0?1:Math.min(1,(now-lockStart)/LOCK_MS);if(fill)fill.style.width=(p*100)+'%';if(p>=1){locked=false;if(hint)hint.innerHTML=`DRAG <strong>← / →</strong> TO DECIDE${hasUp?' · <strong>↑</strong> COUNCIL':''}${hasDown?' · <strong>↓</strong> PRIVATE':''}`;return}lockRAF=requestAnimationFrame(update)}lockRAF=requestAnimationFrame(update);}

function bindDrag(card,hasUp,hasDown){card.addEventListener('pointerdown',e=>{if(closing||overlay.classList.contains('open'))return;activePointer={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,time:performance.now(),lastX:e.clientX,lastY:e.clientY,lastT:performance.now(),vx:0,vy:0};try{card.setPointerCapture(e.pointerId)}catch(err){}card.classList.add('dragging')});
 card.addEventListener('pointermove',e=>{const p=activePointer;if(!p||p.id!==e.pointerId)return;const now=performance.now();const dt=Math.max(8,now-p.lastT);p.vx=(e.clientX-p.lastX)/dt;p.vy=(e.clientY-p.lastY)/dt;p.lastX=e.clientX;p.lastY=e.clientY;p.lastT=now;p.dx=e.clientX-p.x;p.dy=e.clientY-p.y;let x=p.dx,y=p.dy;if(locked){x*=.14;y*=.14}else if(y>0&&!hasDown)y*=.16;else if(y<0&&!hasUp)y*=.16;const rotate=x*.034;card.style.transform=`translate3d(${x}px,${y}px,0) rotate(${rotate}deg)`;showChip(x,y,hasUp,hasDown)});
 card.addEventListener('pointerup',e=>release(card,e,hasUp,hasDown));card.addEventListener('pointercancel',()=>spring(card));card.addEventListener('lostpointercapture',()=>{if(activePointer){activePointer=null;spring(card)}});
}
function showChip(dx,dy,hasUp,hasDown){['chipLeft','chipRight','chipUp','chipDown'].forEach(id=>document.getElementById(id)?.classList.remove('on'));if(locked)return;let id='';if(Math.abs(dx)>Math.abs(dy)*.8&&Math.abs(dx)>28)id=dx<0?'chipLeft':'chipRight';else if(dy<-30&&hasUp)id='chipUp';else if(dy>30&&hasDown)id='chipDown';if(id)document.getElementById(id)?.classList.add('on');}
function release(card,e,hasUp,hasDown){const p=activePointer;if(!p||e.pointerId!==p.id)return;activePointer=null;card.classList.remove('dragging');if(locked)return spring(card);const dx=p.dx,dy=p.dy;const sideways=Math.abs(dx)>Math.abs(dy)*.75;const vert=Math.abs(dy)>Math.abs(dx)*.75;
 if(vert&&dy<-(Math.abs(p.vy)>.7?50:85)&&hasUp)return fly(card,0,-innerHeight,()=>enterArena('up'));
 if(vert&&dy>(Math.abs(p.vy)>.7?50:85)&&hasDown)return fly(card,0,innerHeight,()=>enterArena('down'));
 if(sideways&&Math.abs(dx)>(Math.abs(p.vx)>.7?50:92))return fly(card,dx<0?-innerWidth:innerWidth,dy*.22,()=>decide(dx<0?'left':'right'));
 spring(card);
}
function spring(card){if(!card)return;card.classList.remove('dragging');card.style.transform='translate3d(0,0,0) rotate(0deg)';['chipLeft','chipRight','chipUp','chipDown'].forEach(id=>document.getElementById(id)?.classList.remove('on'));}
function fly(card,x,y,done){closing=true;card.style.transition='transform .28s cubic-bezier(.3,.05,.75,.4),opacity .24s';card.style.transform=`translate3d(${x}px,${y}px,0) rotate(${x*.015}deg)`;card.style.opacity='0';setTimeout(done,275);}

const EDWARD_ALIASES=EDWARD_BIOS.flatMap(b=>b.names.map(name=>({name,id:b.id}))).sort((a,b)=>b.name.length-a.name.length);
const EDWARD_NAME_REGEX=new RegExp('\\b('+EDWARD_ALIASES.map(x=>x.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
function edwardBioFor(name){const text=String(name||'').toLowerCase();return EDWARD_BIOS.find(b=>b.names.some(alias=>alias.toLowerCase()===text))||EDWARD_BIOS.find(b=>b.names.some(alias=>alias.length>=5&&text.includes(alias.toLowerCase())))||null;}
function edwardLinkedText(raw){const text=String(raw==null?'':raw);let result='',last=0;EDWARD_NAME_REGEX.lastIndex=0;let match;
 while((match=EDWARD_NAME_REGEX.exec(text))!==null){result+=E(text.slice(last,match.index));result+='<button type="button" class="person-link" data-person="'+E(match[0])+'" aria-label="About '+E(match[0])+'">'+E(match[0])+'</button>';last=match.index+match[0].length;}
 return result+E(text.slice(last));
}
function edwardPeek(name){const bio=edwardBioFor(name),label=bio?bio.title:name;const desc=bio?bio.summary:'This person or representative appears in the present petition. Their exact motives and private agreements may not be known to the Crown.';

 const sb=world.sandbox;const matching=sb?Object.entries(SANDBOX_ACTORS).find(([id,a])=>bio&&(id===bio.id||a.name.toLowerCase().includes(bio.names[0].toLowerCase()))):null;
 const actorId=matching?.[0]||bio?.id;const bonds=sb?.deep?.bonds?.filter(x=>x.public&&(x.a===actorId||x.b===actorId)).slice(-2).map(x=>`${SANDBOX_ACTORS[x.a]?.name||x.a} and ${SANDBOX_ACTORS[x.b]?.name||x.b}: ${x.kind} (${x.year})`)||[];

 if(id==='edinburgh')return 'The Kingdom of Scotland is independent. Scottish diplomacy and the northern frontier matter to English royal security; the Scottish court is not simulated as a full agent.';
 if(id==='north')return f.north_rising_1464==='averted'?'A negotiated northern settlement prevented the expected 1464 campaign in this timeline. Later loyalties remain contingent.':world.visited.includes('hexham')?'The campaign around Hexham has been fought. Restoring everyday authority remains a separate problem.':'Northern magnates, border fortresses and Lancastrian connections remain unsettled. Edward knows only what messengers have reported.';

 if(id==='london')return 'Westminster is the seat of royal government; London merchants and officers supply credit, petitions and political information. '+(world.offices.chamberlain==='hastings'?'Hastings has been appointed chamberlain in this reign.':'The king’s household remains a contested channel of access.');

/* SAVE SYSTEM — three independent local slots, plus the existing autosave.
 * Export/import are important because Safari can clear site storage.
 */
const EDWARD_SLOT_PREFIX='edward_manual_reign_';
function edwardValidSave(w){return !!(w&&w.version===10&&Array.isArray(w.visited)&&Array.isArray(w.chronicle)&&w.facts&&w.offices&&Number.isFinite(w.turn)&&w.turn>=0&&w.turn<5000);}
function edwardReadSlot(i){try{const obj=JSON.parse(localStorage.getItem(EDWARD_SLOT_PREFIX+i));return obj&&edwardValidSave(obj.world)?obj:null;}catch(e){return null;}}
function edwardYear(w){return w.sandbox?String(w.sandbox.year):(CHAPTERS[w.chapterIndex]?.date||'1461');}
function edwardSlotMarkup(){return [1,2,3].map(i=>{const obj=edwardReadSlot(i),w=obj?.world;
 return '<div class="save-row"><div><div class="save-title">'+(obj?'Reign '+i+' · '+E(edwardYear(w)):'Empty slot '+i)+'</div><div class="save-detail">'+(obj?E(w.turn)+' decisions · '+E(new Date(obj.savedAt).toLocaleDateString())+' · '+E(obj.name||'Edward IV'):'No reign saved here')+'</div></div><div class="save-buttons"><button data-save-slot="'+i+'">Save</button><button data-load-slot="'+i+'" '+(!obj?'disabled':'')+'>Load</button><button data-delete-slot="'+i+'" '+(!obj?'disabled':'')+'>×</button></div></div>';
 }).join('');}
function edwardSaveMenu(){openSheet('Save your Reign','<div class="eyebrow">AUTOSAVE + THREE MANUAL CHRONICLES</div><p>The current game saves automatically in this browser. Manual slots let you preserve different timelines. Export a file to keep a copy outside Safari.</p><div id="saveSlots">'+edwardSlotMarkup()+'</div><div class="save-tools"><button id="exportReign">↓ Export current reign</button><label for="importReign">↑ Import a saved reign<input id="importReign" type="file" accept="application/json,.json"></label></div><div class="save-notice" id="saveNotice" role="status"></div><p><small>Browser saves are local to this device and website. They are not synchronized between devices. Importing or loading replaces the current autosave, not the other manual slots.</small></p>');
 sheet.querySelectorAll('[data-save-slot]').forEach(b=>b.onclick=()=>{const i=b.dataset.saveSlot;const prev=edwardReadSlot(i);if(prev&&!confirm('Overwrite saved reign '+i+'?'))return;
  try{localStorage.setItem(EDWARD_SLOT_PREFIX+i,JSON.stringify({schema:1,savedAt:new Date().toISOString(),name:'Edward IV',world:world}));edwardSaveMenu();edwardNotice('Reign '+i+' saved.');}catch(e){edwardNotice('Storage unavailable. Export your reign as a file instead.');}
 });
 sheet.querySelectorAll('[data-load-slot]').forEach(b=>b.onclick=()=>{const i=b.dataset.loadSlot,obj=edwardReadSlot(i);if(!obj)return;if(!confirm('Load reign '+i+'? Your current unsaved progress will be replaced.'))return;edwardLoadSnapshot(obj.world);});
 sheet.querySelectorAll('[data-delete-slot]').forEach(b=>b.onclick=()=>{const i=b.dataset.deleteSlot;if(!confirm('Delete saved reign '+i+'?'))return;try{localStorage.removeItem(EDWARD_SLOT_PREFIX+i);}catch(e){}edwardSaveMenu();edwardNotice('Slot '+i+' cleared.');});
 document.getElementById('exportReign').onclick=edwardExport;
 document.getElementById('importReign').addEventListener('change',edwardImport);
}
function edwardNotice(s){const el=document.getElementById('saveNotice');if(el)el.textContent=s;}
function edwardLoadSnapshot(w){if(!edwardValidSave(w)){edwardNotice('This file does not contain a compatible EDWARD reign.');return;}
 try{world=JSON.parse(JSON.stringify(w));saveWorld(world);current=null;arena=null;closing=false;activePointer=null;edwardClosePeek();closeSheet();if(world.finished)ending();else begin();}catch(e){edwardNotice('Could not load this reign.');console.error(e);}
}
function edwardExport(){try{const payload=JSON.stringify({app:'EDWARD IV',format:1,exportedAt:new Date().toISOString(),world:world},null,2);const blob=new Blob([payload],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='EDWARD-reign-'+edwardYear(world).replace(/[^0-9a-z-]/gi,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);edwardNotice('Save file prepared. Keep it in Files or another safe location.');}catch(e){edwardNotice('Export failed: '+e.message);}}
function edwardImport(e){const file=e.target.files?.[0];if(!file)return;if(file.size>6*1024*1024){edwardNotice('Save file too large.');return;}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!edwardValidSave(data.world)){edwardNotice('Incompatible or invalid save file.');return;}if(!confirm('Import this reign and replace your current autosave?'))return;edwardLoadSnapshot(data.world);}catch(err){edwardNotice('Could not read the JSON save file.');}};reader.onerror=()=>edwardNotice('File could not be read.');reader.readAsText(file);}
/* Original adaptive, opt-in score. No audio files or external streaming.
 * Safari requires a direct user gesture to create/resume AudioContext.
 */
const EDWARD_SCORE={ctx:null,bus:null,on:false,mood:'court',timer:null,step:0,next:0};
const EDWARD_MODES={court:[0,3,5,7,10,12,15],battle:[0,1,3,5,7,8,10],north:[0,3,5,7,10,12,14],sea:[0,2,5,7,9,12,14],manor:[0,3,5,7,10,12,15],succession:[0,1,3,7,8,10,12]};
function edwardTone(freq,when,duration,loud,type){const a=EDWARD_SCORE,ctx=a.ctx;if(!ctx||!a.bus)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type||'sine';osc.frequency.setValueAtTime(freq,when);gain.gain.setValueAtTime(.00001,when);gain.gain.exponentialRampToValueAtTime(Math.max(.00002,loud),when+.065);gain.gain.exponentialRampToValueAtTime(.00001,when+duration);osc.connect(gain);gain.connect(a.bus);osc.start(when);osc.stop(when+duration+.06);}
function edwardScoreTick(){const a=EDWARD_SCORE;if(!a.on||!a.ctx)return;const ctx=a.ctx;if(a.next<ctx.currentTime)a.next=ctx.currentTime+.07;const scale=EDWARD_MODES[a.mood]||EDWARD_MODES.court;while(a.next<ctx.currentTime+.8){const n=a.step,degree=scale[[0,2,4,1,5,3,2,6][n%8]],base=a.mood==='battle'?110:a.mood==='sea'?146.83:130.81;

function edwardSentenceSummary(raw,max=190){
 const text=String(raw||'').trim();if(text.length<=max)return text;
 const sentences=text.match(/[^.!?]+[.!?]+(?:["”']|$)?/g)||[];
 if(!sentences.length)return text.slice(0,max).replace(/\s+\S*$/,'').trim()+'…';
 const first=sentences[0].trim(),last=sentences[sentences.length-1].trim();
 if(first.length<=max*.67&&last!==first&&/[?]$/.test(last)&&first.length+last.length+1<=max)return first+' '+last;
 if(first.length<=max)return first;
 const split=first.match(/^.{60,170}?[;,]/);if(split)return split[0].replace(/[;,]$/,'')+'…';
 return first.slice(0,max).replace(/\s+\S*$/,'').trim()+'…';
}
function edwardFocusData(){if(!current)return null;const n=current,detail=arena?n[arena]:null;
 const key=n.storyInfo?(n.storyInfo.id.startsWith('cross:')?n.storyInfo.id:n.storyInfo.id+':'+(SE_STORIES[n.storyInfo.id]?.beats[n.storyInfo.step-1]?.id||'')):null;
 const authored=key?EDWARD_FOCUS_SCENES[key]:null;
 const fullQuote=String(detail?detail.quote:fmt(n.quote,world));
 const fullContext=String(detail?'You have changed who hears this matter. A decision is still required.':fmt(n.context,world));
 const latest=world.reports.slice(-1)[0];
 const original=detail||n;
 const focus=arena?edwardSentenceSummary(fullQuote,175):authored?.line||edwardSentenceSummary(fullQuote,175);
 const stake=arena?'This hearing changes who hears the case, not the decision you must make.':authored?.stake||edwardSentenceSummary(fullContext,145);
 return {key,authored,fullQuote,fullContext,focus,stake,latest,original};
}

function edwardPlainRole(role){return String(role||'')
 .replace(/principal magnate/gi,'powerful noble ally')

function wpDocumentDeath(s){const sb=s.sandbox;if(!sb||sb.year<1476||s.facts.george_neville_death_recorded)return;

 if(s.offices.chancellor==='george')s.offices.chancellor='unassigned';

 scheduleReport(s,{id:'george-neville-death-1476',from:'The royal household',text:'News reaches the court of the death of George Neville, Archbishop of York. The Great Seal must be entrusted to a living officer.',delay:0,certainty:'reported'});
}
function wpInit(s){const sb=s.sandbox;wpDocumentDeath(s);if(!sb.pressure)sb.pressure={schema:1,cases:{},journal:[],triggers:[],causal:[]};
 if(sb.unrest['East Anglia']===undefined)sb.unrest['East Anglia']=0;if(sb.unrest['West Country']===undefined)sb.unrest['West Country']=0;
 return sb.pressure;
}
function wpQueue(s,id,stage){const sb=s.sandbox,st=wpInit(s),caseState=st.cases[id],def=WP_CASES[id];
 const ev={serial:++sb.serial,actor:def.actor,template:'petition',where:def.where,year:sb.year,origin:'conditional-crisis',sourceAction:'a threshold crossed in the simulated world',pressure:{id,stage},parent:caseState?.parent||null};
 sb.events.unshift(ev);caseState.inFlight=true;return ev;
}
function wpSchedule(s){const sb=s.sandbox;if(sb.ended)return;const st=wpInit(s);const year=sb.year;
 if(st.lastScheduledYear===year)return;
 // Save/load recovery: a scheduled event may be the current card, not in the queue.
 for(const [id,row] of Object.entries(st.cases))if(row.inFlight&&!sb.events.some(e=>e.pressure?.id===id)&&sb.current?.pressure?.id!==id)row.inFlight=false;
 const due=Object.entries(st.cases).filter(([id,row])=>row.stage===1&&!row.inFlight&&row.due<=year&&WP_CASES[id].still(s));
 if(due.length){const [id]=due[0];wpQueue(s,id,1);st.lastScheduledYear=year;return;}
 // Cases that resolved themselves off-screen do not produce an empty recap card.
 for(const [id,row] of Object.entries(st.cases))if(row.stage===1&&!row.inFlight&&row.due<=year&&!WP_CASES[id].still(s)){row.stage=2;row.outcome='Pressure subsided after other decisions';st.journal.push({id,year,stage:'resolved-offscreen',cause:'Changed world conditions',outcome:row.outcome});}
 const candidates=Object.entries(WP_CASES).filter(([id,def])=>!st.cases[id]&&year>=def.year&&year<=def.last&&def.eligible(s)).map(([id,def])=>({id,score:(sb.actors[def.actor]?.grievance||0)*3+(id==='treasury'?-sb.credit:0)+hashScore(s.seed,'world-pressure:'+id,year)%5})).sort((a,b)=>b.score-a.score);
 if(candidates.length){const id=candidates[0].id,def=WP_CASES[id];const trigger={year,id,conditions:{unrestNorth:sb.unrest.North,warwickGrievance:sb.actors.warwick.grievance,warwickTrust:sb.actors.warwick.trust,credit:sb.credit}};st.triggers.push(trigger);st.cases[id]={stage:0,due:year,firstYear:year,inFlight:false,parent:null,outcome:null,trigger};wpQueue(s,id,0);}
 st.lastScheduledYear=year;
}

const _wpOldBuildCard=sbBuildCard;
sbBuildCard=function(s,ev){if(!ev.pressure)return _wpOldBuildCard(s,ev);
 const def=WP_CASES[ev.pressure.id],scene=def.scenes[ev.pressure.stage];
 const mk=side=>({label:side==='left'?scene.l:scene.r,effects:w=>{wpResolve(w,ev,side);return {records:[def.name+': '+(side==='left'?scene.l:scene.r)],facts:{last_conditional_crisis:ev.pressure.id}};}});
