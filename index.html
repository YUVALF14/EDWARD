function stReason(s,id){const p=wpInit(s).cases[id]?.trigger?.conditions;if(!p)return 'Consequences of earlier decisions';
 if(id==='warwick')return `Warwick’s grievance reached ${p.warwickGrievance} and trust fell to ${p.warwickTrust}.`;
 if(id==='treasury')return `Royal credit fell to ${p.credit}.`;
 return `Northern unrest reached ${p.unrestNorth}, with rival claims still unresolved.`;
}
function wpResolve(s,ev,side){const sb=s.sandbox,st=wpInit(s),id=ev.pressure.id,row=st.cases[id],def=WP_CASES[id],scene=def.scenes[ev.pressure.stage],effect=side==='left'?scene.le:scene.re;
 if(row.stage!==ev.pressure.stage)throw Error('Crisis stage mismatch '+id);
 if(effect.credit)sb.credit=sbClamp(sb.credit+effect.credit,-8,8);
 if(effect.authority)sb.royalAuthority=sbClamp(sb.royalAuthority+effect.authority,-8,8);
 for(const [region,delta] of Object.entries(effect.unrest||{}))sb.unrest[region]=sbClamp((sb.unrest[region]||0)+delta,0,9);
 for(const [actor,delta] of Object.entries(effect.people||{}))sbAdjust(sb,actor,delta);
 const summary=side==='left'?scene.l:scene.r;
 st.journal.push({id,year:sb.year,stage:row.stage,choice:side,outcome:summary,serial:ev.serial,cause:row.stage===0?stReason(s,id):row.firstOutcome});
 sb.history.push({serial:ev.serial,year:sb.year,actor:def.actor,template:'world-pressure:'+id,where:def.where,origin:'conditional-crisis',side,response:summary,parent:row.parent});
 if(row.parent)st.causal.push({from:row.parent,to:ev.serial,id});
 if(row.stage===0){row.stage=1;row.parent=ev.serial;row.firstOutcome=summary;row.due=sb.year+1;row.inFlight=false;}
 else {row.stage=2;row.inFlight=false;row.outcome=summary;}
 scheduleReport(s,{id:'world-crisis-'+ev.serial,from:scene.who,text:id==='parish'?(side==='left'?'The sheriff has received the names of tenants needing safe passage.':'The parish records the disputed rent and requests a hearing.'):'The officers report that the Crown’s latest order has been received; compliance remains to be verified.',delay:2,certainty:'reported'});
 sb.reactiveCount++;sb.yearTurn++;if(sb.yearTurn>=sb.perYear)sbAdvanceYear(s);
}

  if(k==='debt')return {line:`${a} seeks repayment. ${b} disputes the revenue pledged as security.`,stake:'A verified payment costs the treasury; delay threatens future credit.'};
  if(k==='intelligence')return {line:`${a} alleges that ${b} held a secret meeting. No independent witness has yet been heard.`,stake:'The accusation is not proof. An inquiry may expose a false source.'};
  if(k==='retinue')return {line:`${a} has armed men near ${name}; ${b} says local tenants are threatened.`,stake:'The armed followers are already present. A settlement must be enforced on the ground.'};
  if(k==='wardship'||k==='succession')return {line:`${a} and ${b} disagree over a young heir’s custody and revenues.`,stake:'Guardianship, inheritance and command of a household are separate powers.'};
  if(k==='marriage')return {line:`${a} proposes a marriage that changes ${b}’s claims to service and property.`,stake:'A marriage alliance gives the two households new obligations, not guaranteed loyalty.'};
 }
 const person=SANDBOX_ACTORS[ev.actor];if(!person)return null;

}

  if(accepted){lcChange(s,target,{trust:1,grievance:-2});const rival=LC_PEOPLE[target].rival;lcChange(s,rival,{grievance:-1});if(s.sandbox){const region=LC_PEOPLE[target].region;s.sandbox.unrest[region]=Math.max(0,(s.sandbox.unrest[region]||0)-1);if(s.sandbox.deep?.relationships&&s.sandbox.actors[target]&&s.sandbox.actors[rival]){const rel=dwRel(s.sandbox.deep,target,rival);rel.feud=Math.max(0,rel.feud-1);}}
   for(const p of c.promises.filter(p=>p.target===target&&p.status==='open')){p.status='kept';lcChange(s,target,{trust:1});}
   if(s.sandbox&&['diplomacy','alliance'].includes(m.topic)){s.facts['court_'+m.topic+'_'+target]='witnessed terms';lcChange(s,target,{influence:1});}
   if(m.topic==='land'){if(c.demesneLease){text+=' No uncommitted Crown lease remains; no land grant is made.';}else{c.demesneLease={holder:target,year:lcYear(s),name:'A Crown demesne lease (fictional)',term:'during royal pleasure, existing tenant rights reserved'};s.facts.court_demesne_lessee=target;lcChange(s,target,{influence:1});text+=' A lease of uncommitted Crown demesne is sealed, reserving existing tenants’ rights.';}}
   if(m.topic==='privilege'){s.facts['court_safeconduct_'+target]=true;lcChange(s,target,{trust:1});text+=' I grant safe-conduct for your named servants, subject to keeping the peace.';}
   if(m.topic==='patronage'){s.facts['court_patronage_'+target]='royal household stipend';lcChange(s,target,{influence:1});text+=' A household stipend is granted; disputed land remains subject to title proceedings.';}
  }m.status='closed';
 }
 if(move==='dismiss'){text='We shall speak again when there is more to consider.';m.status='closed';}
 if(move==='record'||move==='delegate'){if(m.kind!=='council')throw Error('This requires a council meeting.');text=move==='record'?'Let every dissent and warrant be entered. I reserve judgment.':'Let the senior officer examine this matter and return with terms.';
  for(const v of m.views)lcRemember(s,v.id,text);
  if(s.sandbox){s.sandbox.royalAuthority=sbClamp(s.sandbox.royalAuthority+(move==='record'?1:-1),-8,8);if(move==='delegate'&&m.views[0])lcChange(s,m.views[0].id,{influence:1,trust:1});}if(move==='delegate'&&m.views[0])c.orders.push({id:'council-inquiry-'+(++c.serial),kind:'investigate',target:m.views[0].id,topic:'evidence',due:c.clock+3,status:'travelling',year:lcYear(s),private:false,attempt:0});m.status='closed';}
 m.transcript.push({clock:c.clock,move,text});m.stage++;if(target)lcRemember(s,target,text);lcLog(s,text,target||'council');lcProcess(s);saveWorld(s);return lcMeeting(s,id);
}
function lcAppoint(s,office,id){const c=lcInit(s);if(!LC_OFFICES[office]||!lcAlive(s,id)||!LC_PEOPLE[id].offices.includes(office))throw Error('This candidate is not eligible for that office.');if(s.offices[office]===id)throw Error('This person already holds the office.');lcCharge(s,1,1);const old=s.offices[office];for(const p of c.promises.filter(p=>p.status==='open'&&p.topic==='appointments')){p.status='broken';lcChange(s,p.target,{trust:-2,grievance:2});lcRemember(s,p.target,'The king granted an office before the promised hearing.');}s.offices[office]=id;c.excluded=c.excluded.filter(x=>x!==id);lcChange(s,id,{trust:1,influence:1});if(LC_PEOPLE[old]){lcChange(s,old,{trust:-1,grievance:2});lcRemember(s,old,'The king replaced me as '+LC_OFFICES[office]+'.');}lcLog(s,'I entrust the office of '+LC_OFFICES[office]+' to '+LC_PEOPLE[id].name+'.');lcProcess(s);saveWorld(s);}
function lcDismiss(s,office){if(!LC_OFFICES[office]||!LC_PEOPLE[s.offices[office]])throw Error('There is no serving officer to dismiss.');lcCharge(s,1,0);const id=s.offices[office];s.offices[office]='unassigned';lcChange(s,id,{trust:-1,grievance:2});lcRemember(s,id,'The king dismissed me as '+LC_OFFICES[office]+'.');lcLog(s,'I discharge '+LC_PEOPLE[id].name+' from the office of '+LC_OFFICES[office]+'.');lcProcess(s);saveWorld(s);}
function lcSeat(s,id,invite){if(!lcAlive(s,id)||!LC_PEOPLE[id].offices.length)throw Error('Only eligible royal servants can be seated.');lcCharge(s,1,0);const c=lcInit(s);if(invite){c.excluded=c.excluded.filter(x=>x!==id);c.invited=[...new Set([...c.invited,id])];}else{c.invited=c.invited.filter(x=>x!==id);c.excluded=[...new Set([...c.excluded,id])];}lcChange(s,id,{trust:invite?1:-1,grievance:invite?-1:1});lcLog(s,LC_PEOPLE[id].name+(invite?' is called to the king’s counsel.':' is excluded from the king’s counsel; any office remains a separate appointment.'));saveWorld(s);}
const LC_VOICE={Support:'I shall support',Reject:'I reject',Give:'I grant',Keep:'I shall keep',Order:'I order',Offer:'I offer',Demand:'I require',Send:'I shall send',Confirm:'I confirm',Suspend:'I suspend',Recognise:'I recognise',Withhold:'I withhold',Authorise:'I authorise',Wait:'I shall wait',Accept:'I accept',Require:'I require',Ratify:'I ratify',Disavow:'I disavow',Supply:'I shall supply',Limit:'I shall limit',Honour:'I shall honour',Name:'I shall name',Protect:'I will protect',Negotiate:'I shall negotiate',Judge:'I shall judge',Appoint:'I appoint',Dismiss:'I dismiss',Pay:'I shall pay',Refuse:'I refuse',Grant:'I grant',Hear:'I shall hear',Allow:'I permit',Choose:'I choose',Take:'I shall take',Investigate:'I shall investigate',Seek:'I shall seek',Set:'I shall set',Use:'I shall use',Make:'I shall make',Register:'I shall register',Arrange:'I shall arrange',Renew:'I renew',Return:'I shall return',Leave:'I shall leave',Put:'I shall put',Hold:'I shall hold',Reconcile:'I shall reconcile',Forgive:'I forgive',Trust:'I shall trust',Secure:'I shall secure',Review:'I shall review',Examine:'I shall examine'};
Object.assign(LC_VOICE,{Pursue:'I shall pursue',Reserve:'I reserve',Refer:'I shall refer',Permit:'I permit',Place:'I shall place',Build:'I shall build',Receive:'I shall receive',Issue:'I shall issue',Promise:'I pledge',Record:'I shall record',Proceed:'I shall proceed',Pass:'I assent to',Apply:'I shall apply',Delegate:'I delegate',Seal:'I shall seal',Write:'I shall write',Strengthen:'I shall strengthen',Compensate:'I shall compensate',Treat:'I shall treat',Reinforce:'I shall reinforce',Enforce:'I shall enforce',Act:'I shall act',Question:'I shall question',Pardon:'I pardon',Restore:'I restore',Prepare:'I shall prepare',Continue:'I shall continue',Marry:'I shall marry',Distinguish:'I shall distinguish',Invite:'I invite',Commission:'I commission',Delay:'I shall delay',Restrict:'I shall restrict',License:'I license',Maintain:'I shall maintain',Consent:'I consent',Publish:'I shall publish',Summon:'I summon',Fund:'I shall fund',Audit:'I shall audit',Settle:'I shall settle',Command:'I command',Entrust:'I entrust',Divide:'I shall divide',Concentrate:'I shall concentrate',Bind:'I shall bind',Respect:'I shall respect',Watch:'I shall watch',Separate:'I shall separate',Defend:'I shall defend',Route:'I shall route',Approve:'I approve',Establish:'I establish',Renegotiate:'I shall renegotiate',Sign:'I shall sign'});
function lcVoice(label){const t=String(label||'').trim().replace(/Edward’s own/g,'my own').replace(/the king’s/g,'my').replace(/before you/g,'before me').replace(/your word/g,'my word');if(!t)return t;if(/^(I |We |Let |Tell |My |Our |You |“)/.test(t))return t;const word=t.match(/^[A-Za-z]+/)?.[0];if(LC_VOICE[word])return LC_VOICE[word]+t.slice(word.length).replace(/\.$/,'')+'.';return t.replace(/\.$/,'')+'.';}
function lcVoiceCard(card){if(!card)return card;const copy={...card};for(const k of ['left','right','wait'])if(card[k])copy[k]={...card[k],mechanicalLabel:card[k].mechanicalLabel||card[k].label,label:lcVoice(card[k].label)};for(const ar of ['up','down'])if(card[ar])copy[ar]=lcVoiceCard(card[ar]);return copy;}
const _lcNext=getNextSituation;getNextSituation=function(s){lcInit(s);return lcVoiceCard(_lcNext(s));};
const _lcResolve=resolveChoice;resolveChoice=function(s,card,side,arena){const c=lcInit(s),selected=(arena?card[arena]:card)?.[side];const witnesses=publicOrPrivateWitnesses(s,card,arena);c.spoken.push({id:card.id,year:lcYear(s),text:selected?.label,register:arena==='down'?'private remark':arena==='up'?'council order':card.tag==='DIPLOMACY'?'diplomatic instruction':'royal declaration',witnesses});c.clock+=2;lcProcess(s);return _lcResolve(s,card,side,arena);};

const _lcSandboxInit=sbInit;sbInit=function(s){const existed=!!s.sandbox;const sb=_lcSandboxInit(s);if(!existed&&s.court){for(const [id,p] of Object.entries(s.court.people)){if(sb.actors[id]){sb.actors[id].grievance=Math.max(sb.actors[id].grievance,p.grievance);sb.actors[id].influence=sbClamp(sb.actors[id].influence+Math.max(0,p.influence-2),0,10);}}}return sb;};

/* UI for the persistent court ledger. All player speeches are reconstructed. */
function lcNotice(fn){try{fn();}catch(e){const el=document.getElementById('courtNotice');if(el)el.textContent=e.message;else alert(e.message);}}
function lcStatus(){const c=lcInit(world);return '<div class="court-budget"><span>'+Math.max(0,8-(c.spent[lcYear(world)]||0))+' court weeks available</span><span>'+c.purse+' household funds</span></div><p class="court-small">Court business uses a limited allowance within the current year. Travel continues as you decide cases. Spending also strains royal credit. Funds are abstract, not pounds.</p><p id="courtNotice" role="status"></p>';}
function lcOpen(){const c=lcInit(world),people=Object.keys(LC_PEOPLE).filter(id=>lcAlive(world,id));
 const pending=c.orders.filter(o=>o.status==='travelling');const meetings=c.audiences.filter(m=>m.status==='open');
 openSheet('The King’s Business','<div class="eyebrow">LIVING COURT · EXPERIMENTAL</div>'+lcStatus()+
 '<div class="court-tabs"><button id="courtCouncil">Royal Council</button><button id="courtLedger">Promises & correspondence</button></div>'+
 '<form id="courtForm"><label for="courtAction">Your initiative</label><select id="courtAction">'+Object.entries(LC_ACTIONS).map(([id,a])=>'<option value="'+id+'">'+E(a.name)+'</option>').join('')+'</select><label for="courtPerson">Whom do you approach?</label><select id="courtPerson">'+people.map(id=>'<option value="'+id+'">'+E(LC_PEOPLE[id].name)+'</option>').join('')+'</select><label for="courtPurpose">Purpose of the meeting</label><select id="courtPurpose"><option value="service">Service and commissions</option><option value="appointments">A disputed appointment</option><option value="settlement">A regional settlement</option><option value="confidence">Private confidence</option><option value="diplomacy">Diplomatic terms</option><option value="patronage">Household stipend</option><option value="land">A Crown demesne lease</option><option value="privilege">A safe-conduct privilege</option></select><p id="courtCost" class="court-small"></p><button class="court-primary" type="submit">Send my instructions</button></form>'+
 '<div class="eyebrow court-heading">READY TO BE HEARD</div>'+(meetings.map(m=>'<button class="court-row" data-audience="'+E(m.id)+'"><b>'+E(m.target?LC_PEOPLE[m.target].name:'The Royal Council')+'</b><span>'+E(m.topic)+' · '+(m.private?'private audience':'formal business')+'</span></button>').join('')||'<p class="court-small">No replies are waiting.</p>')+
 '<details class="reading-detail"><summary>Messengers on the road <span>'+pending.length+'</span></summary><div class="reading-detail-body">'+pending.map(o=>'<p>'+E(LC_ACTIONS[o.kind].name)+' · '+E(LC_PEOPLE[o.target]?.name||'Council')+' · at least '+Math.max(0,o.due-c.clock)+' court weeks</p>').join('')+'</div></details>');
 const kind=document.getElementById('courtAction'),target=document.getElementById('courtPerson'),purpose=document.getElementById('courtPurpose');
 function cost(){const a=LC_ACTIONS[kind.value];document.getElementById('courtCost').textContent=a.weeks+' court week(s) · '+a.cost+' funds · reply may be delayed, conditional or refused.';target.disabled=kind.value==='council';if(['mediate','intervene'].includes(kind.value))purpose.value='settlement';if(kind.value==='patronage')purpose.value='patronage';if(['diplomacy','alliance'].includes(kind.value))purpose.value='diplomacy';}kind.onchange=cost;cost();
 document.getElementById('courtForm').onsubmit=e=>{e.preventDefault();lcNotice(()=>{lcIssue(world,kind.value,target.value,purpose.value);lcOpen();});};
 document.getElementById('courtCouncil').onclick=lcCouncil;document.getElementById('courtLedger').onclick=lcLedger;
 sheet.querySelectorAll('[data-audience]').forEach(b=>b.onclick=()=>lcAudience(b.dataset.audience));
}
function lcAudience(id){const m=lcMeeting(world,id);if(!m)return lcOpen();const target=m.target;
 const buttons=m.kind==='council'?[['record','Let every dissent be entered. I reserve judgment.'],['delegate','My senior officer shall examine the terms.'],['dismiss','We shall meet again when there is more to consider.']]:[
 ...(!m.evidence?[['question','I will hear the witnesses and examine the warrants.']]:[]),['reassure','Your lawful service has not lost my regard.'],['threaten','You will answer for defiance of my commission.'],['promise','I pledge to hear your claim before another grant.'],['settle',m.topic==='patronage'?'I offer a stipend. Let disputed title be heard lawfully.':'I offer witnessed terms. Both households shall be heard.'],['dismiss','We shall speak again when there is more to consider.']];
 openSheet(target?LC_PEOPLE[target].name:'The Royal Council',lcStatus()+'<div class="eyebrow">'+E(m.private?'PRIVATE AUDIENCE':m.kind==='council'?'COUNCIL DELIBERATION':'FORMAL REPLY')+'</div><blockquote class="court-speech">“'+E(m.line)+'”</blockquote>'+(m.goal?'<p><b>What he seeks:</b> '+E(m.goal)+'</p>':'')+
 (m.views||[]).map(v=>'<div class="row"><b>'+E(LC_PEOPLE[v.id].name)+'</b><span>“'+E(v.text)+'”</span><small>'+E(v.info)+'</small></div>').join('')+
 (m.status==='open'?'<div class="court-responses">'+buttons.map(([move,text])=>'<button data-court-response="'+move+'">“'+E(text)+'”<small>'+E(move==='dismiss'?'End audience · no cost':move==='settle'?'1 week · 2 funds · assent is uncertain':move==='promise'?'1 week · fulfil through a witnessed settlement within 5 court weeks':'1 week')+'</small></button>').join('')+'</div>':'<p><b>This audience has ended.</b></p>')+
 '<details class="reading-detail"><summary>Earlier words & this audience</summary><div class="reading-detail-body">'+[...m.memories.map(x=>x.text),...m.transcript.map(x=>x.text)].map(t=>'<p>'+E(t)+'</p>').join('')+'</div></details><p class="court-small">All dialogue is fictional reconstruction. A hearing does not establish guilt or transfer disputed land.</p><button id="courtBack" class="court-primary">Return to royal business</button>');
 sheet.querySelectorAll('[data-court-response]').forEach(b=>b.onclick=()=>lcNotice(()=>{lcRespond(world,id,b.dataset.courtResponse);lcAudience(id);}));document.getElementById('courtBack').onclick=lcOpen;
}
function lcCouncil(){const members=lcMembers(world),c=lcInit(world);openSheet('The Royal Council',lcStatus()+'<p>Your officers and invited servants offer counsel through their own interests and connections. Removing an officer does not strip his hereditary lands or Church dignity.</p><button class="court-primary" id="conveneCouncil">Convene the Council · 1 week / 1 fund</button>'+
 Object.entries(LC_OFFICES).map(([office,title])=>'<div class="court-office"><h3>'+E(title)+'</h3><p>'+E(LC_PEOPLE[world.offices[office]]?.name||world.offices[office].replaceAll('_',' '))+'</p><label for="candidate-'+office+'">Eligible replacement</label><select id="candidate-'+office+'">'+Object.keys(LC_PEOPLE).filter(id=>lcAlive(world,id)&&LC_PEOPLE[id].offices.includes(office)).map(id=>'<option value="'+id+'">'+E(LC_PEOPLE[id].name)+'</option>').join('')+'</select><div class="court-tabs"><button data-appoint="'+office+'">Appoint · 1 week / 1 fund</button><button data-dismiss="'+office+'" '+(!LC_PEOPLE[world.offices[office]]?'disabled':'')+'>Dismiss · 1 week</button></div></div>').join('')+
 '<div class="eyebrow court-heading">PERSONAL COUNSEL</div>'+Object.keys(LC_PEOPLE).filter(id=>lcAlive(world,id)&&LC_PEOPLE[id].offices.length).map(id=>'<details class="reading-detail"><summary>'+E(LC_PEOPLE[id].name)+' <span>'+E(members.includes(id)?'in council':'outside council')+'</span></summary><div class="reading-detail-body"><p>'+E(LC_PEOPLE[id].goal)+'</p><p><b>Connections:</b> '+E(LC_PEOPLE[id].family)+'; '+E(LC_PEOPLE[id].kin.map(k=>LC_PEOPLE[k]?.name||k).join(', ')||'individual royal service')+'</p><p><b>Information:</b> '+E(LC_PEOPLE[id].info)+'</p>'+c.people[id].memory.slice(-2).map(m=>'<p>'+E(m.text)+'</p>').join('')+'<button data-seat="'+id+'" data-invite="'+(!members.includes(id))+'">'+(members.includes(id)?'Exclude from counsel':'Invite to counsel')+' · 1 week</button></div></details>').join('')+'<p class="court-small">Alternate appointments are gameplay developments. The office of Chancellor requires an experienced clerical administrator in this model. Documented battle deaths are not imposed on a reign where that battle never occurred.</p>');
 sheet.querySelectorAll('[data-appoint]').forEach(b=>b.onclick=()=>lcNotice(()=>{lcAppoint(world,b.dataset.appoint,document.getElementById('candidate-'+b.dataset.appoint).value);lcCouncil();}));sheet.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=()=>lcNotice(()=>{lcDismiss(world,b.dataset.dismiss);lcCouncil();}));sheet.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>lcNotice(()=>{lcSeat(world,b.dataset.seat,b.dataset.invite==='true');lcCouncil();}));document.getElementById('conveneCouncil').onclick=()=>lcNotice(()=>{const id=lcIssue(world,'council',null,'appointments');lcAudience(id);});
}
function lcLedger(){const c=lcInit(world);openSheet('Words the Court Remembers','<div class="eyebrow">PROMISES · REPORTS · ROYAL ORDERS</div>'+c.promises.slice().reverse().map(p=>'<div class="row"><b>'+E(LC_PEOPLE[p.target]?.name)+' · '+E(p.status)+'</b><span>A hearing before another grant · '+E(p.topic)+(p.status==='open'?' · '+Math.max(0,p.due-c.clock)+' court weeks remain':'')+'</span></div>').join('')+'<details class="reading-detail" open><summary>Royal business <span>'+c.journal.length+' entries</span></summary><div class="reading-detail-body">'+c.journal.slice(-25).reverse().map(j=>'<div class="row"><b>'+E(j.year)+'</b><span>'+E(j.text)+'</span></div>').join('')+'</div></details><details class="reading-detail"><summary>The king’s spoken decisions <span>'+c.spoken.length+'</span></summary><div class="reading-detail-body">'+c.spoken.slice(-20).reverse().map(j=>'<p>'+E(j.year)+' · '+E(j.register)+'<br>“'+E(j.text)+'”</p>').join('')+'</div></details>');}
function lcInstall(){if(!current||!document.getElementById('card'))return;let bar=document.getElementById('courtAccess');if(!bar){bar=document.createElement('button');bar.id='courtAccess';bar.type='button';bar.className='court-access';bar.onclick=lcOpen;const anchor=document.getElementById('tapActions')||app.querySelector('.nav');if(anchor)anchor.before(bar);}
 const ready=lcInit(world).audiences.filter(m=>m.status==='open').length;if(bar)bar.textContent='♔ Royal Initiative'+(ready?' · '+ready+' replies':'');
 const source=arena?current[arena]:current;
 document.querySelectorAll('#tapActions [data-choice]').forEach(b=>{const side=b.dataset.choice;if(source?.[side])b.textContent='“'+lcVoice(source[side].label)+'”';});
 for(const side of ['left','right']){const chip=document.getElementById(side==='left'?'chipLeft':'chipRight');if(chip&&source?.[side])chip.textContent='“'+lcVoice(source[side].label)+'”';}
}
const _lcRender=renderCard;renderCard=function(){current=lcVoiceCard(current);_lcRender();lcInstall();};
const _lcReadRender=edwardReadingRender;edwardReadingRender=function(){_lcReadRender();lcInstall();};
const _lcCouncilArchive=showCouncil;showCouncil=lcCouncil;
const _lcCloseSheet=closeSheet;closeSheet=function(){_lcCloseSheet();lcInstall();};
const _lcMenu=edwardGameMenu;edwardGameMenu=function(){_lcMenu();const b=document.createElement('button');b.className='menu-choice';b.textContent='Royal Initiative & remembered promises';b.onclick=lcOpen;sheet.appendChild(b);};
window.EDWARD_COURT={open:lcOpen,council:lcCouncil,get state(){return lcInit(world);},issue:(kind,target,topic)=>lcIssue(world,kind,target,topic),respond:(id,move)=>lcRespond(world,id,move)};
